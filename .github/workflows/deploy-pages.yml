name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "tools/build-trip-config.js"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: frontend-production
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure trip settings
        env:
          TRIP_CONFIG_JSON: ${{ vars.TRIP_CONFIG_JSON }}
        run: node tools/build-trip-config.js

      - name: Write deployment identity
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          node -e 'require("fs").writeFileSync("frontend/public/deployment.json", JSON.stringify({ commit: process.env.DEPLOY_COMMIT, built_at: new Date().toISOString() }) + "\n")'

      - name: Install dependencies
        run: npm ci

      - name: Validate and build
        run: npm run ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    name: Deploy production frontend
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify deployed commit and critical assets
        env:
          FRONTEND_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="${FRONTEND_URL%/}"
          for attempt in $(seq 1 12); do
            payload="$(curl -fsS -H 'Cache-Control: no-cache' "$base/deployment.json?attempt=$attempt" || true)"
            if printf '%s' "$payload" | grep -q "$EXPECTED_COMMIT"; then
              break
            fi
            if [ "$attempt" = 12 ]; then
              echo "deployed commit could not be verified" >&2
              exit 1
            fi
            sleep 5
          done
          for path in plans.html trip-config.js sw.js images/cover_hongkong.webp; do
            curl -fsS -o /dev/null -H 'Cache-Control: no-cache' "$base/$path"
          done
