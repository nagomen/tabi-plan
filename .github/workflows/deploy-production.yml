name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy"
        required: true
        default: "main"
      install_nginx:
        description: "Render and install nginx config before deploy"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure trip settings
        env:
          TRIP_CONFIG_JSON: ${{ vars.PRODUCTION_TRIP_CONFIG_JSON || vars.TRIP_CONFIG_JSON }}
        run: node tools/build-trip-config.js

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  deploy:
    name: Deploy to nginx VPS
    needs:
      - build
      - deploy-api
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate production settings
        env:
          APP_DIR: ${{ vars.PRODUCTION_APP_DIR }}
          DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
        run: |
          if [ -z "$APP_DIR" ]; then
            echo "PRODUCTION_APP_DIR repository variable is required." >&2
            exit 1
          fi
          if [ -z "$DOMAIN" ]; then
            echo "PRODUCTION_DOMAIN repository variable is required." >&2
            exit 1
          fi

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Prepare VPS upload directory
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          APP_DIR: ${{ vars.PRODUCTION_APP_DIR }}
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          fingerprint: ${{ secrets.PRODUCTION_SSH_FINGERPRINT }}
          envs: APP_DIR
          script_stop: true
          script: |
            if [ -z "$APP_DIR" ]; then
              echo "PRODUCTION_APP_DIR repository variable is required." >&2
              exit 1
            fi
            mkdir -p "$APP_DIR/frontend"
            rm -rf "$APP_DIR/frontend/dist"

      - name: Upload build to VPS
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          fingerprint: ${{ secrets.PRODUCTION_SSH_FINGERPRINT }}
          source: "frontend/dist"
          target: ${{ vars.PRODUCTION_APP_DIR }}
          overwrite: true

      - name: Publish through nginx
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          APP_DIR: ${{ vars.PRODUCTION_APP_DIR }}
          DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
          REPO_BRANCH: ${{ inputs.ref }}
          INSTALL_NGINX: ${{ inputs.install_nginx && '1' || '0' }}
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          fingerprint: ${{ secrets.PRODUCTION_SSH_FINGERPRINT }}
          envs: APP_DIR,DOMAIN,REPO_BRANCH,INSTALL_NGINX
          script_stop: true
          script: |
            if [ -z "$APP_DIR" ]; then
              echo "PRODUCTION_APP_DIR repository variable is required." >&2
              exit 1
            fi
            if [ -z "$DOMAIN" ]; then
              echo "PRODUCTION_DOMAIN repository variable is required." >&2
              exit 1
            fi
            cd "$APP_DIR"
            args=""
            if [ "$INSTALL_NGINX" = "1" ]; then
              args="--install-nginx"
            fi
            DOMAIN="$DOMAIN" REPO_BRANCH="$REPO_BRANCH" bash infra/deploy-static.sh --skip-build $args

  deploy-api:
    name: Deploy API and migrate database
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      # AI 機能のキーはリポジトリには置かない。Secrets からサーバーの
      # 環境ファイルへ書き込む。未設定なら何もしない（機能だけ無効になる）。
      # secrets は if: では参照できないので、空かどうかは script 側で見る。
      - name: Sync OpenAI key to VPS
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          ENV_FILE: ${{ vars.PRODUCTION_API_ENV_FILE || '~/secure_env/travel-api.env' }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI_MODEL: ${{ vars.PRODUCTION_OPENAI_MODEL }}
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          fingerprint: ${{ secrets.PRODUCTION_SSH_FINGERPRINT }}
          envs: ENV_FILE,OPENAI_KEY,OPENAI_MODEL
          script_stop: true
          script: |
            if [ -z "$OPENAI_KEY" ]; then
              echo "OPENAI_KEY が未設定なので何もしません。"
              exit 0
            fi
            file="${ENV_FILE/#\~/$HOME}"
            if [ ! -f "$file" ]; then
              echo "$file がありません。" >&2
              exit 1
            fi
            umask 077
            tmp="$(mktemp)"
            grep -v -E '^(OPENAI_KEY|OPENAI_MODEL)=' "$file" > "$tmp" || true
            printf 'OPENAI_KEY=%s\n' "$OPENAI_KEY" >> "$tmp"
            if [ -n "$OPENAI_MODEL" ]; then
              printf 'OPENAI_MODEL=%s\n' "$OPENAI_MODEL" >> "$tmp"
            fi
            install -m 600 "$tmp" "$file"
            rm -f "$tmp"
            echo "OPENAI_KEY を書き込みました（値は出力しません）"

      # VPS の配置先は git clone ではないため、Actions からソースを同期する。
      # API 専用 workflow と同じ方式に揃え、VPS にリポジトリ認証情報を置かない。
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Send source to VPS
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          APP_DIR: ${{ vars.PRODUCTION_APP_DIR }}
        run: |
          set -euo pipefail
          umask 077
          key="$(mktemp)"
          printf '%s\n' "$SSH_KEY" > "$key"
          known="$(mktemp)"
          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known"
            strict="-o StrictHostKeyChecking=yes"
          else
            echo "::warning::PRODUCTION_SSH_KNOWN_HOSTS が未設定です。ホスト鍵を検証せず初回接続を受理します。"
            strict="-o StrictHostKeyChecking=accept-new"
          fi
          rsync -az --delete \
            --exclude '.git/' --exclude 'node_modules/' --exclude 'dist/' \
            --exclude 'data/store/' \
            -e "ssh -i $key -p $SSH_PORT $strict -o UserKnownHostsFile=$known" \
            ./ "$SSH_USER@$SSH_HOST:$APP_DIR/"
          rm -f "$key" "$known"

      - name: Deploy API on VPS
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          APP_DIR: ${{ vars.PRODUCTION_APP_DIR }}
          API_DOMAIN: ${{ vars.PRODUCTION_API_DOMAIN }}
          REPO_BRANCH: ${{ inputs.ref }}
          INSTALL_NGINX: ${{ inputs.install_nginx && '1' || '0' }}
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          fingerprint: ${{ secrets.PRODUCTION_SSH_FINGERPRINT }}
          envs: APP_DIR,API_DOMAIN,REPO_BRANCH,INSTALL_NGINX
          script_stop: true
          script: |
            if [ -z "$APP_DIR" ]; then
              echo "PRODUCTION_APP_DIR repository variable is required." >&2
              exit 1
            fi
            cd "$APP_DIR"
            args="--skip-git"
            if [ "$INSTALL_NGINX" = "1" ]; then
              if [ -z "$API_DOMAIN" ]; then
                echo "PRODUCTION_API_DOMAIN repository variable is required when install_nginx is enabled." >&2
                exit 1
              fi
              args="$args --install-nginx"
            fi
            APP_DIR="$APP_DIR" API_DOMAIN="$API_DOMAIN" REPO_BRANCH="$REPO_BRANCH" bash infra/deploy-api.sh $args
