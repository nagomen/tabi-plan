name: Deploy API

# API だけを VPS へ配る。フロントは GitHub Pages の Deploy Frontend が担当する。
#
# 接続には CI 専用の鍵を使う。個人の鍵は登録しない。
# 鍵を無効にしたいときは、サーバーの ~/.ssh/authorized_keys から
# github-actions-deploy-api の行を消すだけでよい。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "配るブランチ"
        required: true
        default: "main"

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy-api:
    name: Deploy API and migrate database
    runs-on: ubuntu-latest

    steps:
      # 秘密情報はリポジトリに置かない。Secrets からサーバーの環境ファイルへ
      # 書き込む。未設定なら何もしない（AI 機能だけ無効のまま動く）。
      - name: Sync OpenAI key to VPS
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          ENV_FILE: ${{ vars.PRODUCTION_API_ENV_FILE || '~/secure_env/travel-api.env' }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI_MODEL: ${{ vars.PRODUCTION_OPENAI_MODEL }}
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          fingerprint: ${{ secrets.PRODUCTION_SSH_FINGERPRINT }}
          envs: ENV_FILE,OPENAI_KEY,OPENAI_MODEL
          script_stop: true
          script: |
            if [ -z "$OPENAI_KEY" ]; then
              echo "OPENAI_KEY が未設定なので何もしません。"
              exit 0
            fi
            file="${ENV_FILE/#\~/$HOME}"
            if [ ! -f "$file" ]; then
              echo "$file がありません。" >&2
              exit 1
            fi
            umask 077
            tmp="$(mktemp)"
            grep -v -E '^(OPENAI_KEY|OPENAI_MODEL)=' "$file" > "$tmp" || true
            printf 'OPENAI_KEY=%s\n' "$OPENAI_KEY" >> "$tmp"
            if [ -n "$OPENAI_MODEL" ]; then
              printf 'OPENAI_MODEL=%s\n' "$OPENAI_MODEL" >> "$tmp"
            fi
            install -m 600 "$tmp" "$file"
            rm -f "$tmp"
            echo "OPENAI_KEY を書き込みました（値は出力しません）"

      # サーバー側の配置先は git のクローンではないので、ここから中身を送る。
      # サーバーにリポジトリの認証情報を置かずに済むぶん、こちらの方が安全。
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate API
        run: |
          npm ci
          npm run typecheck -w api
          npm test -w api

      - name: Send source to VPS
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          # VPS のホスト鍵を固定する。値は `ssh-keyscan -p <port> <host>` の出力を
          # PRODUCTION_SSH_KNOWN_HOSTS シークレットへ入れる。未設定なら
          # 初回接続時受理（TOFU）へフォールバックし、警告を出す。
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          APP_DIR: ${{ vars.PRODUCTION_APP_DIR }}
        run: |
          set -euo pipefail
          umask 077
          key="$(mktemp)"
          printf '%s\n' "$SSH_KEY" > "$key"
          known="$(mktemp)"
          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known"
            strict="-o StrictHostKeyChecking=yes"
          else
            echo "::warning::PRODUCTION_SSH_KNOWN_HOSTS が未設定です。ホスト鍵を検証せず初回接続を受理します（MITM 耐性なし）。ssh-keyscan の出力をシークレットに設定してください。"
            strict="-o StrictHostKeyChecking=accept-new"
          fi
          rsync -az --delete \
            --exclude '.git/' --exclude 'node_modules/' --exclude 'dist/' \
            --exclude 'data/store/' \
            -e "ssh -i $key -p $SSH_PORT $strict -o UserKnownHostsFile=$known" \
            ./ "$SSH_USER@$SSH_HOST:$APP_DIR/"
          rm -f "$key" "$known"

      - name: Deploy API on VPS
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          APP_DIR: ${{ vars.PRODUCTION_APP_DIR }}
          API_DOMAIN: ${{ vars.PRODUCTION_API_DOMAIN }}
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          fingerprint: ${{ secrets.PRODUCTION_SSH_FINGERPRINT }}
          envs: APP_DIR,API_DOMAIN
          script_stop: true
          script: |
            if [ -z "$APP_DIR" ]; then
              echo "PRODUCTION_APP_DIR が必要です。" >&2
              exit 1
            fi
            cd "$APP_DIR"
            APP_DIR="$APP_DIR" API_DOMAIN="$API_DOMAIN" \
              bash infra/deploy-api.sh --skip-git

      - name: Check the API answers
        run: |
          for path in /api/ai/itinerary /api/ai/itinerary-options; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json' -d '{}' \
              "https://${{ vars.PRODUCTION_API_DOMAIN }}$path")
            echo "$path → HTTP $code"
            # 401（セッション必須）まで届けば、経路は生きている
            if [ "$code" = "404" ] || [ "$code" = "000" ]; then
              echo "経路が見つかりません。" >&2
              exit 1
            fi
          done
