<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>行程編集 | 旅行</title>
</head>
<body>
<div class="edit-app" id="editor">
  <div data-app-header></div>

  <div class="ed-toolbar">
    <div class="ed-search">
      <span data-search-icon aria-hidden="true"></span>
      <input type="search" data-filter placeholder="日付、都市、内容で検索">
    </div>
    <div class="ed-daysel">
      <span data-day-icon aria-hidden="true"></span>
      <select data-day-filter aria-label="日付で絞り込み"></select>
    </div>
  </div>

  <main class="ed-list" data-list></main>
</div>

<script src="./trip-config.js"></script>
<script type="module" src="./src/itinerary-editor/main.ts"></script>
</body>
</html>
