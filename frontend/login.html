<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5a42">
<link rel="manifest" href="site.webmanifest">
<link rel="icon" href="icon-32.webp" type="image/webp" sizes="32x32">
<link rel="apple-touch-icon" href="icon-192.webp">
<title>ログイン | Tabi Plan</title>
</head>
<body>
<main class="lg">
  <div class="lg-brand" data-ic-brand>Tabi Plan</div>

  <div class="lg-logged" data-logged>
    <span data-logged-text></span>
  </div>

  <h1 class="lg-title" data-title>ログイン</h1>
  <p class="lg-sub" data-sub>メールアドレスとパスワードでログインします。</p>

  <div class="lg-tabs" role="tablist">
    <button class="lg-tab is-active" type="button" data-mode="login" role="tab">ログイン</button>
    <button class="lg-tab" type="button" data-mode="signup" role="tab">新規登録</button>
  </div>

  <form data-form novalidate>
    <div class="lg-field" data-field-name hidden>
      <label class="lg-label" for="lg-name">名前</label>
      <input class="lg-input" id="lg-name" name="name" type="text" autocomplete="name" maxlength="24" placeholder="表示名">
    </div>
    <div class="lg-field">
      <label class="lg-label" for="lg-email">メールアドレス</label>
      <input class="lg-input" id="lg-email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required>
    </div>
    <div class="lg-field">
      <label class="lg-label" for="lg-password">パスワード</label>
      <input class="lg-input" id="lg-password" name="password" type="password" autocomplete="current-password" placeholder="8文字以上" required>
    </div>

    <p class="lg-error" data-error aria-live="polite"></p>

    <button class="lg-submit" type="submit" data-submit><span data-submit-label>ログイン</span></button>
  </form>

  <p class="lg-foot"><a href="plans.html" data-skip>ログインせずに使う</a></p>

  <p class="lg-note">※ 現在は試作のため、アカウント情報はこの端末/開発用 JSON に保存されます（パスワードはハッシュ化）。本物のサーバー認証は将来 DB 接続時に導入します。</p>
</main>

<script src="./trip-config.js"></script>
<script type="module" src="./src/login/main.ts"></script>
</body>
</html>
