<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5a42">
<link rel="manifest" href="site.webmanifest">
<link rel="icon" href="icon-32.webp" type="image/webp" sizes="32x32">
<link rel="apple-touch-icon" href="icon-192.webp">
<title>旅行履歴 | Tabi Plan</title>
</head>
<body>
<main class="pv">
  <div data-app-header></div>

  <!-- 掲示板に貼った紙一枚に、名前と集計をまとめる -->
  <div class="pv-masthead">
  <div class="pv-sheet">
  <header class="pv-hero">
    <p class="pv-eyebrow">Member history</p>
    <div class="pv-avatar" data-avatar aria-hidden="true">—</div>
    <h1 class="pv-name" data-name>—</h1>
    <div class="pv-flags" data-flags hidden></div>
    <div class="pv-friend-action" data-friend-action></div>
  </header>

  <!-- 集計（訪問国・旅行・訪問地・日数） -->
  <section class="pv-stats" data-stats hidden>
    <div class="pv-stat" data-stat-icon="globeAlt">
      <span class="pv-stat-icon" aria-hidden="true"></span>
      <span class="pv-stat-body">
        <span class="pv-stat-num" data-country-count>0</span>
        <span class="pv-stat-label">訪問国</span>
      </span>
    </div>
    <div class="pv-stat" data-stat-icon="briefcase">
      <span class="pv-stat-icon" aria-hidden="true"></span>
      <span class="pv-stat-body">
        <span class="pv-stat-num" data-trip-count>0</span>
        <span class="pv-stat-label">旅行</span>
      </span>
    </div>
    <div class="pv-stat" data-stat-icon="mapPin">
      <span class="pv-stat-icon" aria-hidden="true"></span>
      <span class="pv-stat-body">
        <span class="pv-stat-num" data-place-count>0</span>
        <span class="pv-stat-label">訪問地</span>
      </span>
    </div>
    <div class="pv-stat" data-stat-icon="calendarDays">
      <span class="pv-stat-icon" aria-hidden="true"></span>
      <span class="pv-stat-body">
        <span class="pv-stat-num" data-day-count>0</span>
        <span class="pv-stat-label">旅した日数</span>
      </span>
    </div>
  </section>
  </div>
  </div>

  <!-- 非公開 -->
  <section class="pv-private" data-private hidden>
    <b>プロフィールには掲載されていません</b>
    <span>この人は旅行履歴をプロフィールに表示していません。</span>
  </section>

  <!-- 公開コンテンツ -->
  <div class="pv-content" data-content hidden>
    <section class="pv-sec pv-sec--map">
      <div class="pv-sec-head">
        <div class="pv-sec-title-box">
          <span class="pv-kicker">MAP</span>
          <h2 class="pv-sec-title">行った場所<span class="pv-sec-count" data-map-count></span></h2>
        </div>
        <select class="pv-filter" data-map-filter aria-label="期間で絞り込む">
          <option value="0">全期間</option>
          <option value="3">過去3ヶ月</option>
          <option value="6">過去6ヶ月</option>
          <option value="12">過去1年</option>
          <option value="36">過去3年</option>
        </select>
      </div>
      <div class="pv-map" data-map></div>
    </section>

    <section class="pv-sec pv-sec--trips">
      <div class="pv-sec-head">
        <div class="pv-sec-title-box">
          <span class="pv-kicker">TRIPS</span>
          <h2 class="pv-sec-title">旅行の記録<span class="pv-sec-count" data-trips-count></span></h2>
        </div>
      </div>
      <div class="pv-trips" data-trips></div>
    </section>

    <section class="pv-sec pv-sec--created" data-created-panel hidden>
      <div class="pv-sec-head">
        <div class="pv-sec-title-box">
          <span class="pv-kicker">CREATED</span>
          <h2 class="pv-sec-title">作成した計画<span class="pv-sec-count" data-created-count></span></h2>
        </div>
      </div>
      <div class="pv-created-plans" data-created-plans></div>
    </section>

    <section class="pv-sec pv-sec--cal">
      <div class="pv-sec-head">
        <div class="pv-sec-title-box">
          <span class="pv-kicker">CALENDAR</span>
          <h2 class="pv-sec-title">カレンダー</h2>
        </div>
        <div class="pv-cal-nav-group">
          <b data-cal-title>—</b>
          <button class="pv-cal-nav" type="button" data-cal-prev aria-label="前の月">‹</button>
          <button class="pv-cal-nav" type="button" data-cal-next aria-label="次の月">›</button>
        </div>
      </div>
      <div class="pv-cal" data-cal></div>
    </section>
  </div>
</main>

<script src="./trip-config.js"></script>
<script type="module" src="./src/person/main.ts"></script>
</body>
</html>
