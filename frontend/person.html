<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5a42">
<link rel="manifest" href="site.webmanifest">
<link rel="icon" href="icon-32.webp" type="image/webp" sizes="32x32">
<link rel="apple-touch-icon" href="icon-192.webp">
<title>旅行履歴 | 旅行計画</title>
</head>
<body>
<main class="pv">
  <div data-app-header></div>

  <section class="pv-head">
    <div class="pv-avatar" data-avatar aria-hidden="true">—</div>
    <div class="pv-head-main">
      <p class="pv-eyebrow">Member history</p>
      <h1 class="pv-name" data-name>—</h1>
      <div class="pv-flags" data-flags hidden></div>
      <div class="pv-friend-action" data-friend-action></div>
    </div>
  </section>

  <section class="pv-stats" data-stats hidden>
    <div class="pv-stat" data-stat-icon="globeAlt"><span class="pv-stat-icon" aria-hidden="true"></span><span class="pv-stat-body"><span class="pv-stat-num" data-country-count>0</span><span class="pv-stat-label">訪問国</span></span></div>
    <div class="pv-stat" data-stat-icon="briefcase"><span class="pv-stat-icon" aria-hidden="true"></span><span class="pv-stat-body"><span class="pv-stat-num" data-trip-count>0</span><span class="pv-stat-label">旅行</span></span></div>
    <div class="pv-stat" data-stat-icon="mapPin"><span class="pv-stat-icon" aria-hidden="true"></span><span class="pv-stat-body"><span class="pv-stat-num" data-place-count>0</span><span class="pv-stat-label">訪問地</span></span></div>
    <div class="pv-stat" data-stat-icon="calendarDays"><span class="pv-stat-icon" aria-hidden="true"></span><span class="pv-stat-body"><span class="pv-stat-num" data-day-count>0</span><span class="pv-stat-label">旅した日数</span></span></div>
  </section>

  <!-- 非公開 -->
  <section class="pv-private" data-private hidden>
    <b>旅行履歴は非公開です</b>
    <span>この人は旅行履歴を公開していません。</span>
  </section>

  <!-- 公開コンテンツ -->
  <div data-content hidden>
    <section class="pv-sec">
      <div class="pv-sec-head">
        <div>
          <span class="pv-kicker">MAP</span>
          <h2 class="pv-sec-title">行った場所<span class="pv-sec-count" data-map-count></span></h2>
        </div>
        <select class="pv-filter" data-map-filter aria-label="期間で絞り込む">
          <option value="0">全期間</option>
          <option value="3">過去3ヶ月</option>
          <option value="6">過去6ヶ月</option>
          <option value="12">過去1年</option>
          <option value="36">過去3年</option>
        </select>
      </div>
      <div class="pv-map" data-map></div>
    </section>

    <section class="pv-sec">
      <div class="pv-sec-head">
        <div>
          <span class="pv-kicker">TRIPS</span>
          <h2 class="pv-sec-title">旅行の記録<span class="pv-sec-count" data-trips-count></span></h2>
        </div>
      </div>
      <div class="pv-trips" data-trips></div>
    </section>

    <section class="pv-sec">
      <div class="pv-sec-head">
        <div>
          <span class="pv-kicker">CALENDAR</span>
          <h2 class="pv-sec-title">カレンダー</h2>
        </div>
      </div>
      <div class="pv-cal-head">
        <button class="pv-cal-nav" type="button" data-cal-prev aria-label="前の月">‹</button>
        <b data-cal-title>—</b>
        <button class="pv-cal-nav" type="button" data-cal-next aria-label="次の月">›</button>
      </div>
      <div class="pv-cal" data-cal></div>
    </section>
  </div>
</main>

<script src="./trip-config.js"></script>
<script type="module" src="./src/person/main.ts"></script>
</body>
</html>
