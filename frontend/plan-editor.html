<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5a42">
<link rel="manifest" href="site.webmanifest">
<link rel="icon" href="icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icon-192.png">
<title>計画を作成 | 旅行計画</title>
<style>
  :root {
    --ink: #111916;
    --muted: #66716b;
    --line: #dfe4e0;
    --line-strong: #c3ccc5;
    --paper: #ffffff;
    --wash: #f7f9f7;
    --green: #0b5a42;
    --green-soft: #e7f1ec;
    --blue: #22719d;
    --amber: #b87418;
    --red: #cf4f3d;
    --violet: #6246a6;
    --gray: #68746e;
    --head-h: 60px;
  }

  html { background: #fff; }
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #fff;
    color: var(--ink);
    font-family: "Avenir Next", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    line-height: 1.55;
  }

  a { color: inherit; }
  .hi { width: 1.15em; height: 1.15em; vertical-align: -0.18em; flex: none; }

  .pe {
    max-width: 1320px;
    margin: 0 auto;
    border: 1px solid var(--line-strong);
    background: var(--paper);
    min-height: 100vh;
  }

  /* ヘッダー */
  .pe-head {
    position: sticky;
    top: 0;
    z-index: 40;
    height: var(--head-h);
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 12px;
    align-items: center;
    padding: 0 18px;
    border-bottom: 1px solid var(--line);
    background: rgba(255, 255, 255, .97);
    backdrop-filter: blur(16px);
  }

  .pe-head h1 {
    margin: 0;
    font-size: clamp(16px, 2.4vw, 21px);
    font-weight: 950;
    line-height: 1.1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .pe-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 2px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 760;
  }

  .pe-meta .is-dirty { color: var(--amber); }
  .pe-meta .is-ok { color: var(--green); }

  .pe-head-actions { display: flex; gap: 8px; align-items: center; }

  .pe-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 38px;
    padding: 0 14px;
    border: 1px solid var(--line-strong);
    background: #fff;
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    font-weight: 850;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
  }

  .pe-btn[hidden] { display: none; }
  .pe-btn.green { border-color: rgba(11, 90, 66, .4); color: var(--green); }
  .pe-btn.primary { border-color: var(--green); background: var(--green); color: #fff; }
  .pe-btn:disabled { opacity: .5; cursor: not-allowed; }

  /* 2ペイン */
  .pe-stage {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 420px;
    align-items: start;
  }

  .pe-main { min-width: 0; border-right: 1px solid var(--line); }

  .pe-mapwrap {
    position: sticky;
    top: var(--head-h);
    align-self: start;
    height: calc(100vh - var(--head-h));
    display: grid;
    grid-template-rows: 1fr auto;
    background: var(--wash);
  }

  .pe-map { width: 100%; height: 100%; min-height: 320px; background: #e8efe9; }
  .pe-map-foot {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 12px;
    padding: 9px 12px;
    border-top: 1px solid var(--line);
    background: #fff;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
  }
  .pe-legend { display: inline-flex; align-items: center; gap: 5px; }
  .pe-legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .pe-map-hint { color: var(--green); font-weight: 800; }

  /* セクション共通 */
  .pe-setup { padding: 16px 18px; border-bottom: 1px solid var(--line); }

  .pe-sec-title {
    display: flex;
    align-items: center;
    gap: 7px;
    margin: 0 0 4px;
    color: var(--green);
    font-size: 12px;
    font-weight: 900;
    letter-spacing: .07em;
    text-transform: uppercase;
  }

  .pe-sec-note { margin: 0 0 12px; color: var(--muted); font-size: 12.5px; font-weight: 700; }

  .pe-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 11px; }
  .pe-field { display: grid; gap: 5px; min-width: 0; align-content: start; }
  .pe-field.c2 { grid-column: span 2; }
  .pe-field.c3 { grid-column: span 3; }
  .pe-field.c6 { grid-column: 1 / -1; }

  .pe-field > span {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--ink);
    font-size: 12px;
    font-weight: 800;
  }
  .pe-field > span em { font-style: normal; color: var(--muted); font-size: 11px; font-weight: 700; }
  .pe-req { padding: 1px 6px; border-radius: 999px; background: var(--green-soft); color: var(--green); font-size: 10px; font-weight: 900; }

  .pe-field input,
  .pe-field select,
  .pe-field textarea {
    width: 100%;
    min-width: 0;
    min-height: 40px;
    border: 1px solid var(--line-strong);
    background: #fff;
    color: var(--ink);
    padding: 8px 10px;
    font: inherit;
    font-size: 14px;
  }
  .pe-field textarea { min-height: 54px; resize: vertical; }
  .pe-field input:focus,
  .pe-field select:focus,
  .pe-field textarea:focus {
    outline: none;
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(11, 90, 66, .14);
  }
  .pe-daterange-warn { color: var(--red); font-size: 12px; font-weight: 800; margin: 10px 0 0; }

  /* ルート（大まかな場所） */
  .pe-route { margin-top: 14px; }
  .pe-route-list { display: grid; gap: 7px; margin-bottom: 9px; }
  .pe-city {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 9px 7px 11px;
    border: 1px solid var(--line-strong);
    background: #fff;
    font-size: 13px;
    font-weight: 800;
    flex-wrap: wrap;
  }
  .pe-city .pe-city-n { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--green-soft); color: var(--green); font-size: 11px; font-weight: 900; flex: none; }
  .pe-city-name { flex: 1; min-width: 80px; min-height: 34px; border: 1px solid var(--line-strong); background: #fff; padding: 6px 9px; font: inherit; font-size: 13px; font-weight: 800; }
  .pe-city-name:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(11, 90, 66, .14); }
  .pe-city-dates { display: inline-flex; align-items: center; gap: 6px; }
  .pe-city-dates select { min-height: 34px; border: 1px solid var(--line-strong); background: #fff; padding: 4px 6px; font: inherit; font-size: 12px; }
  .pe-city-sep { color: var(--muted); }
  .pe-city.no-geo { border-style: dashed; }
  .pe-city.no-geo .pe-city-name { color: var(--muted); }
  .pe-city button[data-act="city-del"] { border: 0; background: none; color: var(--muted); cursor: pointer; display: inline-grid; place-items: center; padding: 2px; flex: none; }
  .pe-city button[data-act="city-del"]:hover { color: var(--red); }

  /* 都市バンド（日のグループ見出し） */
  .pe-cityband { display: flex; align-items: baseline; gap: 8px; margin: 8px 0 -8px; padding: 2px 2px; color: var(--green); }
  .pe-cityband .hi { align-self: center; }
  .pe-cityband b { font-size: 15px; font-weight: 950; }
  .pe-cityband span { color: var(--muted); font-size: 12px; font-weight: 800; }
  .pe-route-add { display: flex; gap: 8px; max-width: 420px; }
  .pe-route-add input { flex: 1; min-height: 40px; border: 1px solid var(--line-strong); padding: 8px 10px; font: inherit; font-size: 14px; }
  .pe-route-empty { color: var(--muted); font-size: 12.5px; font-weight: 700; }

  /* 行程：日 */
  .pe-days { display: grid; gap: 18px; padding: 8px 18px 8px; }
  .pe-days-count { color: var(--muted); font-size: 12px; font-weight: 800; }
  .pe-trip-summary { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 0; text-transform: none; }

  /* 日へジャンプするストリップ */
  .pe-daystrip {
    position: sticky;
    top: var(--head-h);
    z-index: 20;
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding: 10px 18px;
    border-bottom: 1px solid var(--line);
    background: rgba(255, 255, 255, .96);
    backdrop-filter: blur(12px);
  }
  .pe-daystrip:empty { display: none; }
  .pe-daychip {
    flex: none;
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1px;
    padding: 5px 11px;
    border: 1px solid var(--line-strong);
    background: #fff;
    font: inherit;
    cursor: pointer;
    line-height: 1.15;
  }
  .pe-daychip b { font-size: 12px; font-weight: 900; }
  .pe-daychip span { font-size: 10px; font-weight: 760; color: var(--muted); }
  .pe-daychip:hover { border-color: var(--green); }

  /* 地図トグル */
  .pe-map-toggle {
    margin-left: auto;
    border: 1px solid var(--line-strong);
    background: #fff;
    color: var(--muted);
    font: inherit;
    font-size: 11px;
    font-weight: 800;
    padding: 4px 9px;
    cursor: pointer;
  }
  .pe-map-toggle:hover { color: var(--ink); }
  .pe-map-show {
    position: fixed;
    right: 16px;
    bottom: 74px;
    z-index: 36;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 14px;
    border: 1px solid var(--green);
    background: var(--green);
    color: #fff;
    font: inherit;
    font-size: 13px;
    font-weight: 850;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(17, 25, 22, .2);
  }
  .pe-map-show[hidden] { display: none; }
  .pe.map-collapsed .pe-stage { grid-template-columns: 1fr; }
  .pe.map-collapsed .pe-mapwrap { display: none; }

  .pe-local-note { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11.5px; font-weight: 760; }
  .pe-row:focus-visible,
  .pe-q:focus-visible,
  .pe-daychip:focus-visible,
  .pe-btn:focus-visible { outline: 3px solid rgba(11, 90, 66, .3); outline-offset: 2px; }

  .pe-empty-cta {
    display: grid;
    gap: 6px;
    padding: 30px 22px;
    border: 1px dashed var(--line-strong);
    background: var(--wash);
    text-align: center;
  }
  .pe-empty-cta b { font-size: 16px; }
  .pe-empty-cta span { color: var(--muted); font-size: 13px; font-weight: 700; }

  .pe-day { border: 1px solid var(--line-strong); background: #fff; }

  .pe-day-head {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    gap: 12px;
    align-items: center;
    padding: 11px 13px;
    border-bottom: 1px solid var(--line);
    background: var(--wash);
  }
  .pe-day-badge { display: grid; justify-items: center; min-width: 58px; padding: 5px 9px; border: 1px solid rgba(11, 90, 66, .28); background: var(--green-soft); color: var(--green); }
  .pe-day-badge b { font-size: 14px; font-weight: 950; line-height: 1; }
  .pe-day-badge span { font-size: 10.5px; font-weight: 800; }
  .pe-day-route { min-width: 0; display: grid; gap: 2px; }
  .pe-day-route b { font-size: 14px; font-weight: 850; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pe-day-route span { color: var(--muted); font-size: 11.5px; font-weight: 760; display: inline-flex; align-items: center; gap: 5px; }
  .pe-day-tools { display: flex; gap: 6px; }
  .pe-icon-btn { display: inline-grid; place-items: center; min-width: 32px; min-height: 32px; border: 1px solid var(--line-strong); background: #fff; color: var(--muted); cursor: pointer; }
  .pe-icon-btn:hover { color: var(--ink); }
  .pe-icon-btn.danger:hover { border-color: var(--red); color: var(--red); }
  .pe-icon-btn:disabled { opacity: .3; cursor: not-allowed; }

  .pe-day-body { padding: 8px 13px 13px; }

  /* タイムライン */
  .pe-timeline { display: grid; gap: 0; }
  .pe-node { position: relative; padding-left: 30px; }
  .pe-node::before { content: ""; position: absolute; left: 9px; top: 0; bottom: 0; width: 2px; background: var(--line); }
  .pe-node:first-child::before { top: 16px; }
  .pe-node:last-child::before { bottom: calc(100% - 16px); }
  .pe-node > .pe-dot { position: absolute; left: 4px; top: 11px; width: 12px; height: 12px; border-radius: 50%; background: var(--gray); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line-strong); }

  .pe-node[data-kind="sight"] > .pe-dot { background: var(--green); }
  .pe-node[data-kind="food"] > .pe-dot { background: var(--amber); }
  .pe-node[data-kind="move"] > .pe-dot { background: var(--blue); }
  .pe-node[data-kind="todo"] > .pe-dot { background: var(--gray); }
  .pe-node[data-kind="form"] > .pe-dot { background: var(--violet); }

  /* 折りたたみ行（サマリ） */
  .pe-row {
    display: grid;
    grid-template-columns: auto auto auto minmax(0, 1fr) auto;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 9px 10px;
    margin: 5px 0;
    border: 1px solid var(--line);
    background: #fff;
    text-align: left;
    font: inherit;
    cursor: pointer;
  }
  .pe-grip { display: inline-grid; place-items: center; color: var(--line-strong); cursor: grab; touch-action: none; }
  .pe-grip:active { cursor: grabbing; }
  .pe-grip:hover { color: var(--muted); }
  .pe-drag-ghost { opacity: .4; }
  .pe-drag-chosen { box-shadow: 0 6px 20px rgba(17, 25, 22, .16); }
  .pe-row:hover { border-color: var(--line-strong); }
  .pe-node.is-open > .pe-row { border-color: var(--ink); border-bottom-color: var(--line); }
  .pe-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    white-space: nowrap;
  }
  .pe-chip[data-kind="sight"] { background: var(--green); }
  .pe-chip[data-kind="food"] { background: var(--amber); }
  .pe-chip[data-kind="move"] { background: var(--blue); }
  .pe-chip[data-kind="stay"] { background: var(--red); }
  .pe-chip[data-kind="todo"] { background: var(--gray); }
  .pe-chip[data-kind="form"] { background: var(--violet); }
  .pe-row-time { color: var(--muted); font-size: 12px; font-weight: 850; min-width: 42px; }
  .pe-row-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 800; }
  .pe-row-title small { color: var(--muted); font-weight: 700; }
  .pe-row-title.is-empty { color: var(--muted); font-weight: 700; }
  .pe-row-caret { color: var(--muted); }

  /* 展開フォーム */
  .pe-edit { display: none; padding: 4px 10px 12px; border: 1px solid var(--ink); border-top: 0; margin: -5px 0 5px; background: #fff; }
  .pe-node.is-open > .pe-edit { display: block; }
  .pe-edit-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .pe-edit-grid .c2 { grid-column: span 2; }
  .pe-edit-grid .c4 { grid-column: 1 / -1; }
  .pe-edit .pe-field input,
  .pe-edit .pe-field select,
  .pe-edit .pe-field textarea { min-height: 38px; }
  .pe-edit-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }

  .pe-place-tools { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 6px; }
  .pe-mini { display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-height: 38px; padding: 0 11px; border: 1px solid var(--green); background: var(--green-soft); color: var(--green); font: inherit; font-size: 12px; font-weight: 800; cursor: pointer; white-space: nowrap; }
  .pe-mini:hover { background: #fff; }
  .pe-mini.is-armed { background: var(--green); color: #fff; }
  .pe-geo-status { display: flex; align-items: center; gap: 5px; min-height: 14px; margin-top: 4px; color: var(--muted); font-size: 11px; font-weight: 700; }
  .pe-geo-status.is-ok { color: var(--green); }
  .pe-geo-status.is-warn { color: var(--red); }
  .pe-geo-results { margin-top: 6px; border: 1px solid var(--line-strong); }
  .pe-geo-results button { display: block; width: 100%; text-align: left; padding: 8px 10px; border: 0; border-bottom: 1px solid var(--line); background: #fff; font: inherit; font-size: 12.5px; font-weight: 800; cursor: pointer; }
  .pe-geo-results button:last-child { border-bottom: 0; }
  .pe-geo-results button:hover { background: var(--green-soft); }
  .pe-geo-results small { display: block; color: var(--muted); font-weight: 600; }

  /* 移動（区間） */
  .pe-node[data-kind="move"] > .pe-row { background: #f3f8fb; border-style: dashed; border-color: var(--blue); }
  .pe-seg { display: inline-flex; align-items: center; gap: 7px; min-width: 0; font-size: 13.5px; font-weight: 800; }
  .pe-seg .ep { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pe-seg .mid { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; background: var(--blue); color: #fff; font-size: 11px; font-weight: 800; }
  .pe-seg .arr { color: var(--blue); }

  /* 宿泊（その日の錨） */
  .pe-stay {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: 11px;
    margin-top: 10px;
    padding: 11px 13px;
    border: 1px solid var(--red);
    background: #fdf3f1;
  }
  .pe-stay-ic { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--red); color: #fff; }
  .pe-stay-main { min-width: 0; display: grid; gap: 1px; }
  .pe-stay-main b { font-size: 14px; font-weight: 850; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pe-stay-main b.is-empty { color: var(--muted); font-weight: 700; }
  .pe-stay-main span { color: var(--muted); font-size: 11.5px; font-weight: 760; }
  .pe-stay-edit { color: var(--red); border-color: rgba(207, 79, 61, .4); }

  /* 連泊の継続日 */
  .pe-stay.pe-stay-cont {
    grid-template-columns: auto minmax(0, 1fr);
    background: #fcf1ef;
    border-style: dashed;
  }
  .pe-stay-cont .pe-stay-ic { background: #d98e84; }

  /* クイック追加 */
  .pe-quick { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
  .pe-q {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 38px;
    padding: 0 13px;
    border: 1px solid var(--line-strong);
    background: #fff;
    font: inherit;
    font-size: 13px;
    font-weight: 850;
    cursor: pointer;
  }
  .pe-q[data-kind="sight"]:hover { border-color: var(--green); color: var(--green); }
  .pe-q[data-kind="food"]:hover { border-color: var(--amber); color: var(--amber); }
  .pe-q[data-kind="move"]:hover { border-color: var(--blue); color: var(--blue); }
  .pe-q[data-kind="stay"]:hover { border-color: var(--red); color: var(--red); }
  .pe-q[data-kind="todo"]:hover,
  .pe-q[data-kind="form"]:hover { border-color: var(--ink); }

  /* 前泊からの出発（日跨ぎ） */
  .pe-start {
    position: relative;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    align-items: center;
    gap: 10px;
    margin: 2px 0 8px;
    padding-left: 30px;
  }
  .pe-start::before { content: ""; position: absolute; left: 9px; top: 16px; bottom: -8px; width: 2px; background: var(--line); }
  .pe-start-ic { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: #fdece9; color: var(--red); border: 1px dashed var(--red); }
  .pe-start-main b { font-size: 12px; font-weight: 850; color: var(--muted); }
  .pe-start-main span { color: var(--ink); font-size: 13px; font-weight: 800; }

  .pe-day-empty { color: var(--muted); font-size: 12.5px; font-weight: 700; padding: 8px 2px 2px; }

  /* flatpickr 微調整 */
  .flatpickr-day.selected,
  .flatpickr-day.startRange,
  .flatpickr-day.endRange,
  .flatpickr-day.inRange { background: var(--green); border-color: var(--green); }
  .flatpickr-day.inRange { background: var(--green-soft); border-color: var(--green-soft); color: var(--ink); box-shadow: -5px 0 0 var(--green-soft), 5px 0 0 var(--green-soft); }

  .pe-hint { margin: 0; padding: 4px 18px 20px; color: var(--muted); font-size: 12px; font-weight: 700; }

  /* 保存バー */
  .pe-savebar {
    position: sticky;
    bottom: 0;
    z-index: 35;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 14px;
    padding: 11px 18px;
    border-top: 1px solid var(--line);
    background: rgba(255, 255, 255, .97);
    backdrop-filter: blur(16px);
  }
  .pe-savebar span { color: var(--muted); font-size: 12.5px; font-weight: 760; margin-right: auto; }
  .pe-savebar .pe-btn.primary { min-width: 168px; min-height: 44px; font-size: 14px; }

  /* Leaflet マーカーラベル */
  .pe-pin { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); color: #fff; font-size: 11px; font-weight: 900; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .pe-pin span { transform: rotate(45deg); }
  /* 検索候補ピン（クリックで採用） */
  .pe-candpin {
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #b87418;
    color: #fff;
    font-size: 13px;
    font-weight: 900;
    border: 2px solid #fff;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .35);
    cursor: pointer;
    animation: pe-candpop .25s ease;
  }
  .pe-candpin:hover { background: #0b5a42; }
  @keyframes pe-candpop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  @media (max-width: 980px) {
    .pe { border-right: 0; border-left: 0; }
    .pe-stage { grid-template-columns: 1fr; }
    .pe-main { border-right: 0; }
    .pe-mapwrap { position: static; height: auto; order: -1; border-bottom: 1px solid var(--line); }
    .pe-map { height: 240px; }
    .pe-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pe-field.c3 { grid-column: span 2; }
    .pe-field.c6 { grid-column: 1 / -1; }
    .pe-edit-grid { grid-template-columns: 1fr; }
    .pe-edit-grid .c2 { grid-column: 1; }
  }
</style>
</head>
<body>
<main class="pe" id="editor">
  <header class="pe-head">
    <div>
      <h1 data-title-echo>新しい計画</h1>
      <div class="pe-meta"><span data-status></span></div>
    </div>
    <div class="pe-head-actions">
      <a class="pe-btn" data-back href="plans.html">一覧</a>
      <a class="pe-btn green" data-open href="index.html" hidden>表示</a>
    </div>
  </header>

  <div class="pe-stage">
    <div class="pe-main">
      <section class="pe-setup">
        <h2 class="pe-sec-title" data-ic-setup>骨組み</h2>
        <p class="pe-sec-note">まずは <b>旅行名と期間</b> だけでOK。行きたい都市を「ルート」に足すと地図に出ます。各日の中身は後からで大丈夫。</p>
        <div class="pe-grid">
          <label class="pe-field c3">
            <span>旅行名 <span class="pe-req">必須</span></span>
            <input data-f="title" placeholder="例: 2026年8月 東北旅行">
          </label>
          <label class="pe-field c3">
            <span>期間 <em>カレンダーで開始日→終了日を選択</em></span>
            <input data-range placeholder="期間を選択" readonly>
          </label>
          <label class="pe-field c3">
            <span>メンバー <em>任意</em></span>
            <input data-f="members" placeholder="例: 太郎, 花子">
          </label>
          <label class="pe-field c3">
            <span>共有メモ <em>任意</em></span>
            <input data-f="note" placeholder="全員に見せたい一言メモ">
          </label>
        </div>
        <p class="pe-daterange-warn" data-daterange-warn hidden>終了日は開始日より後にしてください。</p>

        <div class="pe-route">
          <h2 class="pe-sec-title" data-ic-route>ルート（大まかな場所）</h2>
          <div class="pe-route-list" data-cities></div>
          <div class="pe-route-add">
            <input data-city-input placeholder="都市・エリアを追加（例: 盛岡）" aria-label="都市を追加">
            <button class="pe-mini" type="button" data-city-add>追加</button>
          </div>
        </div>
      </section>

      <section style="padding:14px 18px 0;">
        <h2 class="pe-sec-title" data-ic-days>行程 <span class="pe-days-count" data-day-count></span><span class="pe-trip-summary" data-trip-summary></span></h2>
        <p class="pe-sec-note">各日に予定を足します。<b>観光・食事・移動・宿泊</b>を選んで追加。行はハンドルでドラッグ、タップで開いて編集できます。</p>
      </section>
      <nav class="pe-daystrip" data-daystrip aria-label="日へジャンプ"></nav>
      <div class="pe-days" data-days></div>
      <p class="pe-hint">場所を入れると地図に自動表示。見つからない時は予定を開いて「地図で検索」または地図をクリックして指定できます。</p>
    </div>

    <aside class="pe-mapwrap">
      <div class="pe-map" data-map></div>
      <div class="pe-map-foot">
        <span class="pe-legend"><i style="background:#0b5a42"></i>観光</span>
        <span class="pe-legend"><i style="background:#b87418"></i>食事</span>
        <span class="pe-legend"><i style="background:#22719d"></i>移動</span>
        <span class="pe-legend"><i style="background:#cf4f3d"></i>宿泊</span>
        <span class="pe-map-hint" data-map-hint></span>
        <button class="pe-map-toggle" type="button" data-map-toggle>地図を隠す</button>
      </div>
    </aside>
  </div>

  <button class="pe-map-show" type="button" data-map-show hidden>地図を表示</button>

  <datalist id="pe-city-options"></datalist>

  <div class="pe-savebar">
    <span class="pe-local-note" data-local-note>この端末にのみ保存（自動保存）</span>
    <span data-savebar-note></span>
    <button class="pe-btn" type="button" data-export>書き出し</button>
    <button class="pe-btn primary" type="button" data-save>今すぐ保存</button>
  </div>
</main>

<script src="./trip-config.js"></script>
<script type="module" src="./src/plan-editor/main.ts"></script>
</body>
</html>
