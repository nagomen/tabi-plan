<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5a42">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="費用入力">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="expense-entry.webmanifest">
<link rel="icon" href="icon-32.webp" type="image/webp" sizes="32x32">
<link rel="apple-touch-icon" href="icon-192.webp">
<title>費用入力 | 旅行</title>
<style>
  :root {
    --ink: #111916;
    --muted: #66716b;
    --line: #dfe4e0;
    --line-strong: #c3ccc5;
    --paper: #ffffff;
    --wash: #f7f9f7;
    --green: #0b5a42;
    --green-soft: #e7f1ec;
    --blue: #22719d;
    --red: #cf4f3d;
  }

  * { box-sizing: border-box; }

  .hi { width: 1.15em; height: 1.15em; vertical-align: -0.18em; flex: none; }

  html {
    background: #fff;
    overflow-y: scroll;
    scrollbar-gutter: stable;
  }

  body {
    margin: 0;
    background: #fff;
    color: var(--ink);
    font-family: "Avenir Next", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    line-height: 1.5;
  }

  a { color: inherit; }

  .expense-app {
    max-width: var(--app-width, 1120px);
    width: 100%;
    min-height: 100svh;
    margin: 0 auto;
  }

  .expense-head {
    position: sticky;
    top: 0;
    z-index: 20;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 12px;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    background: #fff;
  }

  .expense-title {
    min-width: 0;
  }

  .expense-title h1 {
    margin: 0;
    font-size: 24px;
    line-height: 1.1;
    letter-spacing: 0;
  }

  .expense-title span {
    display: block;
    margin-top: 4px;
    overflow: hidden;
    color: var(--muted);
    font-size: 12px;
    font-weight: 720;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .expense-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 8px;
  }

  .profile-button,
  .expense-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 38px;
    padding: 0 11px;
    border: 1px solid rgba(11, 90, 66, .36);
    color: var(--green);
    font-size: 13px;
    font-weight: 850;
    text-decoration: none;
    white-space: nowrap;
  }

  .profile-button {
    appearance: none;
    -webkit-appearance: none;
    background: var(--green);
    color: #fff;
    font: inherit;
    cursor: pointer;
  }

  .expense-main {
    display: grid;
    gap: 14px;
    padding: 14px 16px 24px;
  }

  .expense-loading,
  .expense-error {
    padding: 12px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--muted);
    font-size: 13px;
    font-weight: 650;
  }

  .expense-error {
    border-color: rgba(207, 79, 61, .35);
    background: #fff7f5;
    color: var(--red);
  }

  .expense-panel {
    display: grid;
    gap: 12px;
  }

  .expense-form {
    display: grid;
    gap: 12px;
  }

  .expense-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 9px;
  }

  .expense-field {
    display: grid;
    gap: 5px;
    min-width: 0;
  }

  .expense-field.wide {
    grid-column: 1 / -1;
  }

  .expense-field span,
  .split-label {
    color: var(--muted);
    font-size: 11px;
    font-weight: 720;
  }

  .required-mark {
    color: var(--red);
    font-weight: 900;
  }

  .expense-field input,
  .expense-field select,
  .expense-field textarea {
    width: 100%;
    max-width: 100%;
    inline-size: 100%;
    max-inline-size: 100%;
    min-width: 0;
    min-inline-size: 0;
    min-height: 44px;
    border: 1px solid var(--line-strong);
    border-radius: 0;
    background: #fff;
    color: var(--ink);
    font: inherit;
    font-size: 16px;
    font-weight: 520;
  }

  .expense-field input,
  .expense-field select {
    padding: 8px 10px;
  }

  .expense-field input[type="date"] {
    display: block;
    appearance: none;
    -webkit-appearance: none;
  }

  .expense-field input[type="date"]::-webkit-date-and-time-value {
    min-width: 0;
    text-align: left;
  }

  .expense-field input[type="date"]::-webkit-calendar-picker-indicator {
    margin: 0;
  }

  .expense-field textarea {
    min-height: 68px;
    padding: 9px 10px;
    resize: vertical;
  }

  .photo-field > span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .photo-field {
    display: grid;
    gap: 8px;
    padding: 10px;
    border: 1px solid var(--line);
    background: #fff;
  }

  .photo-field input[type="file"] {
    min-height: 0;
    border: 0;
    background: transparent;
    padding: 0;
    font-size: 13px;
  }

  .split {
    display: grid;
    gap: 7px;
  }

  .segments {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1px;
    border: 1px solid var(--line-strong);
    background: var(--line-strong);
  }

  .segment {
    display: grid;
    min-width: 0;
    min-height: 42px;
    background: #fff;
    cursor: pointer;
  }

  .segment input,
  .pick input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  .segment span {
    display: grid;
    place-items: center;
    padding: 8px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 720;
    line-height: 1.25;
    text-align: center;
  }

  .segment input:checked + span {
    background: var(--green);
    color: #fff;
  }

  .split-detail {
    display: none;
    gap: 8px;
    padding: 10px;
    border: 1px solid var(--line);
    background: #fff;
  }

  .split-detail.is-visible {
    display: grid;
  }

  .participant-picks,
  .individual-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }

  .pick {
    display: grid;
    min-width: 0;
    cursor: pointer;
  }

  .pick span {
    display: grid;
    place-items: center;
    min-height: 38px;
    border: 1px solid var(--line-strong);
    background: #fff;
    color: var(--ink);
    font-size: 13px;
    font-weight: 720;
  }

  .pick input:checked + span {
    border-color: var(--green);
    background: var(--green-soft);
    color: var(--green);
  }

  .share-total {
    color: var(--muted);
    font-size: 12px;
    font-weight: 720;
  }

  .expense-submit {
    position: sticky;
    bottom: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 10px;
    align-items: center;
    margin-inline: -16px;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    background: #fff;
  }

  .expense-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    color: var(--muted);
    font-size: 12px;
    font-weight: 720;
  }

  .expense-status.is-error {
    color: var(--red);
  }

  .expense-status.is-ok {
    color: var(--green);
  }

  .expense-submit button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-width: 112px;
    min-height: 44px;
    border: 1px solid var(--green);
    border-radius: 0;
    background: var(--green);
    color: #fff;
    padding: 0 18px;
    font: inherit;
    font-size: 15px;
    font-weight: 760;
    cursor: pointer;
  }

  .expense-submit button:disabled {
    border-color: var(--line-strong);
    background: var(--line);
    color: var(--muted);
    cursor: wait;
  }

  .auth {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: grid;
    place-items: center;
    padding: 18px;
    background: rgba(255, 255, 255, .96);
  }

  .auth-box {
    width: min(420px, 100%);
    border: 1px solid var(--line-strong);
    background: #fff;
  }

  .auth-box h2 {
    margin: 0;
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--line);
    font-size: 18px;
    font-weight: 720;
  }

  .auth-body {
    display: grid;
    gap: 12px;
    padding: 16px 18px 18px;
  }

  .auth-body p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
  }

  .auth-body label {
    display: grid;
    gap: 6px;
    font-size: 13px;
    font-weight: 650;
  }

  .auth-body input {
    width: 100%;
    min-height: 48px;
    border: 2px solid var(--green);
    background: #fff;
    color: var(--ink);
    padding: 10px 12px;
    font: inherit;
    font-size: 16px;
    outline: none;
  }

  .auth-body button {
    min-height: 48px;
    border: 1px solid var(--green);
    background: var(--green);
    color: #fff;
    font: inherit;
    font-size: 15px;
    font-weight: 720;
    cursor: pointer;
  }

  .auth-error {
    min-height: 18px;
    color: var(--red);
    font-size: 12px;
    font-weight: 720;
  }

  .identity-modal {
    position: fixed;
    inset: 0;
    z-index: 9998;
    display: grid;
    place-items: center;
    padding: 18px;
    background:
      linear-gradient(135deg, rgba(17, 25, 22, .16), rgba(11, 90, 66, .28)),
      rgba(247, 249, 247, .84);
  }

  .identity-card {
    width: min(460px, 100%);
    border: 1px solid rgba(11, 90, 66, .28);
    background: #fff;
  }

  .identity-card header {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 14px;
    align-items: start;
    padding: 20px 20px 14px;
    border-bottom: 1px solid var(--line);
  }

  .identity-card h2 {
    margin: 0;
    font-size: 22px;
    line-height: 1.15;
    font-weight: 720;
  }

  .identity-card p {
    margin: 7px 0 0;
    color: var(--muted);
    font-size: 13px;
  }

  .identity-mark {
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    border: 1px solid rgba(11, 90, 66, .28);
    background: var(--green-soft);
    color: var(--green);
    font-size: 18px;
    font-weight: 850;
  }

  .identity-body {
    display: grid;
    gap: 14px;
    padding: 16px 20px 20px;
  }

  .identity-field {
    display: grid;
    gap: 6px;
  }

  .identity-field span {
    color: var(--muted);
    font-size: 12px;
    font-weight: 760;
  }

  .identity-field select {
    width: 100%;
    min-height: 46px;
    border: 1px solid var(--line-strong);
    background: #fff;
    color: var(--ink);
    padding: 8px 10px;
    font: inherit;
    font-size: 16px;
  }

  .identity-actions {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    gap: 10px;
    align-items: center;
  }

  .identity-note {
    color: var(--muted);
    font-size: 12px;
    font-weight: 620;
  }

  .identity-actions button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 42px;
    border: 1px solid var(--green);
    background: var(--green);
    color: #fff;
    padding: 0 14px;
    font: inherit;
    font-size: 13px;
    font-weight: 760;
    cursor: pointer;
  }

  .identity-actions button.secondary {
    border-color: var(--line-strong);
    background: #fff;
    color: var(--ink);
  }

  @media (max-width: 560px) {
    .expense-app {
      border-inline: 0;
    }

    .expense-head {
      padding-inline: 14px;
    }

    .expense-actions {
      gap: 6px;
    }

    .profile-button,
    .expense-link {
      min-height: 36px;
      padding-inline: 9px;
      font-size: 12px;
    }

    .expense-main {
      padding-inline: 14px;
    }

    .expense-grid,
    .participant-picks,
    .individual-grid {
      grid-template-columns: 1fr;
    }

    .segments {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .expense-submit {
      margin-inline: -14px;
      padding-inline: 14px;
    }

    .identity-actions {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
<div class="expense-app" id="expenseApp">
  <div data-app-header></div>

  <main class="expense-main">
    <div class="expense-loading" data-loading hidden>読み込み中...</div>
    <div data-error></div>
    <section class="expense-panel" data-expense-entry></section>
  </main>
</div>

<script src="./trip-config.js"></script>
<script type="module" src="./src/expense-entry/main.ts"></script>
</body>
</html>
