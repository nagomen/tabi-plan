<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script src="./redirect-root.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5a42">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tabi Plan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="site.webmanifest">
<link rel="icon" href="icon-32.webp" type="image/webp" sizes="32x32">
<link rel="apple-touch-icon" href="icon-192.webp">
<title>Tabi Plan</title>
</head>
<body>

<div class="trip-live is-loading" id="tripLive">
  <div class="tl-loading" data-loading aria-live="polite" aria-busy="true">
    <div class="tl-loading-card">
      <svg class="tl-loading-plane" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <b>読み込み中</b>
      <span data-loading-label>最新データを取得しています</span>
    </div>
  </div>
  <div data-app-header></div>

  <nav class="tl-actions" data-actions aria-label="主要リンク"></nav>
  <nav class="tl-days" data-days aria-label="日別旅程"></nav>

  <main class="tl-main">
    <!-- メンバー（参加メンバーのみ表示。公開/非公開に関わらず非メンバーは見られない） -->
    <section class="tl-panel tl-members" data-workspace-only data-mobile-view="members" data-section-target="members">
      <div class="tl-sec-head">
        <span class="tl-sec-ic" data-ic="users"></span>
        <h2>メンバー</h2>
        <span class="tl-sec-meta" data-members-count></span>
      </div>
      <p class="tl-members-note">この旅行に参加しているメンバーです。招待した人だけがこの計画を見られます。</p>
      <div class="tl-members-list" data-members-list></div>
      <div class="tl-members-invite" data-members-invite hidden>
        <label class="tl-members-field">
          <span>名前で招待（任意）</span>
          <input type="text" data-invite-name placeholder="招待する人の名前" autocomplete="off">
        </label>
        <button class="tl-button primary" type="button" data-invite-share>招待リンクを共有</button>
        <p class="tl-members-invite-note">リンクを受け取った人がこの旅行に参加でき、メンバーとして追加されます。</p>
      </div>
      <div class="tl-members-leave" data-members-leave hidden>
        <button class="tl-members-leave-btn" type="button" data-leave-trip>この旅行から脱退する</button>
        <span class="tl-members-leave-note">脱退すると、この計画はあなたの「自分の計画」から外れます。</span>
      </div>
    </section>

    <section class="tl-panel tl-map-panel" data-mobile-view="home map" data-section-target="home map">
      <div class="tl-sec-head">
        <span class="tl-sec-ic" data-ic="map"></span>
        <h2>地図・ルート</h2>
        <a class="tl-sec-link" data-my-maps href="#" target="_blank" rel="noopener">Google My Mapsで開く <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="hi" aria-hidden="true" focusable="false"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 0 0 3 8.25v10.5A2.25 2.25 0 0 0 5.25 21h10.5A2.25 2.25 0 0 0 18 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25"/></svg></a>
      </div>
      <div class="tl-map" data-map>
        <div class="tl-map-land" aria-hidden="true"></div>
        <svg class="tl-route-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <polyline data-route points=""></polyline>
        </svg>
        <div class="tl-map-status">
          <span data-location-caption></span>
          <a data-directions href="#" target="_blank" rel="noopener">Google Mapsで経路 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="hi" aria-hidden="true" focusable="false"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 0 0 3 8.25v10.5A2.25 2.25 0 0 0 5.25 21h10.5A2.25 2.25 0 0 0 18 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25"/></svg></a>
        </div>
      </div>
    </section>

    <section class="tl-panel" data-mobile-view="home plan" data-section-target="home plan">
      <div class="tl-timeline">
        <div class="tl-day-title tl-sec-head">
          <span class="tl-sec-ic" data-ic="calendarDays"></span>
          <h2 data-day-title>今日の予定</h2>
          <a class="tl-ai-support" data-ai-support hidden aria-label="計画エディタのAI旅行相談を開く">
            <span class="tl-ai-support-ic" data-ic="sparkles"></span><span>AIサポート</span>
          </a>
          <button class="tl-copy-schedule" type="button" data-copy-schedule aria-label="旅行の全日程をLINEで送れる文章としてコピー">
            <span class="tl-copy-schedule-ic" data-ic="paperAirplane"></span><span data-copy-schedule-label>日程をLINEで送る</span>
          </button>
        </div>
        <div data-day-feed></div>
      </div>
    </section>

    <section class="tl-card-grid" data-section-target="home plan money links">
      <article class="tl-box" data-workspace-only data-mobile-view="money" data-section-target="home money">
        <div class="tl-sec-head">
          <span class="tl-sec-ic" data-ic="banknotes"></span>
          <h2>費用</h2>
        </div>
        <div class="tl-settle">
          <div class="tl-settle-hero">
            <span class="tl-settle-label">あなたの精算額</span>
            <strong class="tl-settle-amount" data-your-due>¥0</strong>
            <span class="tl-settle-sub">
              <span class="tl-settle-metrics">あなたの立替 <b data-your-paid>—</b><i>·</i>費用総額 <b data-paid>¥0</b></span>
            </span>
            <button class="tl-expense-quick-add" type="button" data-expense-open aria-label="費用を追加">
              <span class="tl-expense-quick-add-icon" data-ic="plus"></span>
              <span>費用を追加</span>
            </button>
          </div>
          <!-- スマホでは精算/台帳をタブで切り替える（既定は精算）。PC は両方並べる。 -->
          <div class="tl-money-tabs" role="tablist" aria-label="費用の表示切替">
            <!-- タブは移動のための短い名前。セクション見出し（精算する金額 / 精算履歴 /
                 支払い台帳）と文字が重ならないようにして、役割を分ける。 -->
            <button class="tl-money-tab" type="button" role="tab" data-money-tab="settle" aria-selected="true">精算</button>
            <button class="tl-money-tab" type="button" role="tab" data-money-tab="details" aria-selected="false" data-expense-detail-toggle>台帳</button>
          </div>
          <div class="tl-money-panel" data-money-panel="settle">
            <div class="tl-transfer-list" data-transfers></div>
          </div>
          <div class="tl-money-panel" data-money-panel="details">
            <div class="tl-expense-details" data-expense-details></div>
          </div>
        </div>
      </article>

      <article class="tl-box" data-mobile-view="links" data-section-target="home links">
        <div class="tl-sec-head">
          <span class="tl-sec-ic" data-ic="link"></span>
          <h2 data-links-title>リンク・タスク</h2>
        </div>
        <div class="tl-docs" data-docs></div>
        <div class="tl-checks" data-checks></div>
      </article>

      <article class="tl-box" data-photo-card data-mobile-view="links" data-section-target="home links">
        <div class="tl-sec-head">
          <span class="tl-sec-ic" data-ic="photo"></span>
          <h2>写真アルバム</h2>
        </div>
        <div class="tl-photo-body">
          <a class="tl-photo-art" data-photo-link href="#" target="_blank" rel="noopener" aria-label="写真アルバム"></a>
          <div class="tl-photo-copy"><b data-photo-title></b><span data-photo-meta></span></div>
          <div class="tl-photo-actions">
            <a class="tl-button" data-photo-button href="#" target="_blank" rel="noopener"><span class="tl-btn-ic" data-ic="photo"></span>開く</a>
            <button class="tl-photo-link-edit" type="button" data-photo-link-edit><span class="tl-btn-ic" data-ic="pencilSquare"></span>リンク設定</button>
          </div>
          <form class="tl-photo-link-form" data-photo-link-form hidden>
            <label>
              <span>共有アルバムURL</span>
              <input type="url" data-photo-url placeholder="https://photos.app.goo.gl/...">
            </label>
            <div class="tl-photo-link-form-actions">
              <button type="button" data-photo-link-cancel>キャンセル</button>
              <button type="submit">保存</button>
            </div>
            <p data-photo-link-status aria-live="polite"></p>
          </form>
        </div>
      </article>
    </section>

    <section class="tl-panel tl-local-info" data-mobile-view="links" data-section-target="home links">
      <div class="tl-sec-head">
        <span class="tl-sec-ic" data-ic="globeAlt"></span>
        <h2>国別 お金・移動</h2>
      </div>
      <div class="tl-local-grid" data-local-info></div>
    </section>
  </main>

  <div class="tl-sheet" data-expense-sheet hidden>
    <div class="tl-sheet-scrim" data-expense-close></div>
    <div class="tl-sheet-panel" role="dialog" aria-modal="true" aria-label="費用を追加">
      <div class="tl-sheet-head">
        <b data-expense-sheet-title>費用を追加</b>
        <button type="button" class="tl-sheet-close" data-expense-close aria-label="閉じる"><span data-ic="xMark"></span></button>
      </div>
      <div class="tl-sheet-body">
        <div class="tl-expense-entry" data-expense-entry></div>
      </div>
    </div>
  </div>

  <!-- 下部ナビ。アイコン（heroicon）の下にラベルを置き、選択中だけ色を付ける。
       アイコンは main.ts の MOBILE_NAV_ICONS が起動時に差し込む。 -->
  <nav class="tl-mobile-nav" aria-label="スマホ用ナビゲーション">
    <button type="button" data-mobile-nav="home" aria-selected="true"><span class="tl-nav-ic"></span><span class="tl-nav-label">ホーム</span></button>
    <button type="button" data-mobile-nav="map" aria-selected="false"><span class="tl-nav-ic"></span><span class="tl-nav-label">地図</span></button>
    <button type="button" data-mobile-nav="members" aria-selected="false" data-members-nav><span class="tl-nav-ic"></span><span class="tl-nav-label">メンバー</span></button>
    <button type="button" data-mobile-nav="money" aria-selected="false"><span class="tl-nav-ic"></span><span class="tl-nav-label">費用</span></button>
    <button type="button" data-mobile-nav="links" aria-selected="false"><span class="tl-nav-ic"></span><span class="tl-nav-label">リンク</span></button>
  </nav>
</div>

<script src="./trip-config.js"></script>
<script type="module" src="./src/dashboard/main.ts"></script>
</body>
</html>
