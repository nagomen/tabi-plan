<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5a42">
<link rel="manifest" href="site.webmanifest">
<link rel="icon" href="icon-32.webp" type="image/webp" sizes="32x32">
<link rel="apple-touch-icon" href="icon-192.webp">
<title>マイページ | 旅行計画</title>
</head>
<body>
<main class="mp">
  <div data-app-header></div>

  <section class="mp-profile">
    <div class="mp-avatar" data-avatar>?</div>
    <div class="mp-profile-main">
      <div class="mp-profile-label">ユーザー名</div>
      <div class="mp-name-edit">
        <input data-name type="text" maxlength="24" placeholder="名前を入力" aria-label="ユーザー名">
      </div>
      <p class="mp-profile-note" data-profile-note aria-live="polite">入力すると自動で保存されます</p>
      <div class="mp-account" data-account></div>

      <label class="mp-setting">
        <input type="checkbox" data-history-public>
        <span class="mp-setting-body">
          <span class="mp-setting-title">旅行履歴を公開する</span>
          <span class="mp-setting-note" data-history-note>他の人があなたのアイコンから、行った場所やカレンダーを見られます</span>
        </span>
      </label>
    </div>
  </section>

  <nav class="mp-tabs" aria-label="表示切替">
    <button class="mp-tab is-active" type="button" data-tab="plans" data-ic-plans>計画</button>
    <button class="mp-tab" type="button" data-tab="schedule" data-ic-schedule>日程</button>
    <button class="mp-tab" type="button" data-tab="pay" data-ic-pay>送金</button>
    <button class="mp-tab" type="button" data-tab="friends" data-ic-friends><span>友達</span><span class="mp-tab-badge" data-friend-tab-badge hidden></span></button>
  </nav>

  <div class="mp-body">
    <section class="mp-view" data-view="plans">
      <div class="mp-listhead">
        <h2 class="mp-sec-title">参加している計画 <span class="mp-sec-count" data-plan-count></span></h2>
      </div>
      <div class="mp-list" data-plans></div>
    </section>

    <section class="mp-view" data-view="schedule" hidden>
      <div class="mp-cal-head">
        <button class="mp-cal-nav" type="button" data-cal-prev data-ic-prev aria-label="前の月"></button>
        <b data-cal-title>—</b>
        <button class="mp-cal-nav" type="button" data-cal-next data-ic-next aria-label="次の月"></button>
      </div>
      <div class="mp-cal" data-cal></div>
      <div class="mp-cal-legend" data-cal-legend></div>
    </section>
  </div>

  <section class="mp-view" data-view="pay" hidden>
    <div class="mp-listhead">
      <h2 class="mp-sec-title">送金リンク <span class="mp-sec-count" data-pay-count></span></h2>
    </div>
    <p class="mp-pay-help">精算の「PayPayで送る」で使うため、メンバーの PayPay 受取リンク（<code>https://qr.paypay.ne.jp/…</code>）または ID を登録します。リンクはこの端末にだけ保存されます。</p>
    <div class="mp-paylist" data-paylinks></div>
  </section>

  <section class="mp-view" data-view="friends" hidden>
    <div class="mp-listhead">
      <h2 class="mp-sec-title">友達を探す</h2>
    </div>
    <form class="mp-friend-search" data-friend-search-form>
      <input data-friend-search-input type="text" placeholder="名前またはメールアドレスで検索" aria-label="友達を検索">
      <button type="submit">検索</button>
    </form>
    <p class="mp-friend-note" data-friend-note aria-live="polite"></p>
    <div class="mp-list" data-friend-search-results></div>

    <div class="mp-listhead">
      <h2 class="mp-sec-title">届いている申請 <span class="mp-sec-count" data-friend-incoming-count></span></h2>
    </div>
    <div class="mp-list" data-friend-incoming></div>

    <div class="mp-listhead">
      <h2 class="mp-sec-title">友達 <span class="mp-sec-count" data-friend-count></span></h2>
    </div>
    <div class="mp-list" data-friend-list></div>

    <div class="mp-listhead">
      <h2 class="mp-sec-title">送信中の申請 <span class="mp-sec-count" data-friend-outgoing-count></span></h2>
    </div>
    <div class="mp-list" data-friend-outgoing></div>
  </section>
</main>

<script src="./trip-config.js"></script>
<script type="module" src="./src/mypage/main.ts"></script>
</body>
</html>
