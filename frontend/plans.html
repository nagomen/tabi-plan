<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5a42">
<link rel="manifest" href="site.webmanifest">
<link rel="icon" href="icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icon-192.png">
<title>旅行計画一覧</title>
<style>
  :root {
    --ink: #111916;
    --muted: #66716b;
    --line: #dfe4e0;
    --line-strong: #c3ccc5;
    --paper: #ffffff;
    --wash: #f7f9f7;
    --green: #0b5a42;
    --green-soft: #e7f1ec;
    --blue: #22719d;
    --amber: #b87418;
    --red: #cf4f3d;
    --violet: #6246a6;
  }

  .hi { width: 1.15em; height: 1.15em; vertical-align: -0.18em; flex: none; }

  html { background: #fff; }
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #fff;
    color: var(--ink);
    font-family: "Avenir Next", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    line-height: 1.55;
  }

  a { color: inherit; }

  .hub {
    max-width: var(--app-width, 1120px);
    margin: 0 auto;
    min-height: 100vh;
  }


  .hub-toolbar {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 10px;
    padding: 12px 24px;
    border-bottom: 1px solid var(--line);
    background: #fff;
  }

  .hub-toolbar input {
    width: 100%;
    min-height: 40px;
    border: 1px solid var(--line-strong);
    border-radius: 0;
    background: #fff;
    color: var(--ink);
    padding: 6px 14px;
    font: inherit;
    font-size: 14px;
    font-weight: 400;
    box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    transition: all 0.15s ease;
  }

  .hub-toolbar input:focus-visible {
    outline: none;
    border-color: var(--green);
    box-shadow: 0 0 0 3px var(--green-soft);
  }

  .hub-new {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 40px;
    padding: 0 16px;
    border: 1px solid var(--green);
    border-radius: 0;
    background: var(--green);
    color: #fff;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .02em;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(11, 90, 66, 0.15);
    transition: all 0.15s ease;
  }

  .hub-new:hover,
  .hub-new:focus-visible {
    background: #0d6c4f;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(11, 90, 66, 0.25);
  }

  .hub-new .hi {
    width: 1.1em;
    height: 1.1em;
  }

  /* セクション見出し */
  .hub-sec-head {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 24px 24px 8px;
  }
  .hub-sec-head[hidden] { display: none; }
  .hub-sec-ic {
    flex: none;
    display: inline-flex;
    align-items: center;
    color: var(--green);
  }
  .hub-sec-ic .hi { width: 20px; height: 20px; vertical-align: 0; }
  .hub-sec-head h2 {
    margin: 0;
    font-size: 16px;
    font-weight: 850;
    letter-spacing: .01em;
  }
  .hub-sec-count {
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    background: var(--wash);
    padding: 2px 8px;
    border-radius: 0;
  }

  /* グリッドレイアウト（カード型） */
  .hub-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 24px;
    padding: 12px 24px 32px;
  }
  .hub-grid[hidden] { display: none; }

  /* 計画カード */
  .plan-row {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    border: 1px solid var(--line);
    border-radius: 0;
    background: #fff;
    overflow: hidden;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    box-shadow: 5px 5px 0 rgba(17, 25, 22, 0.16);
  }

  .plan-row:first-child {
    border-top: 1px solid var(--line);
  }

  .plan-row:hover {
    transform: translate(-2px, -2px);
    box-shadow: 9px 9px 0 rgba(17, 25, 22, 0.22);
    border-color: var(--line-strong);
  }

  /* カバー画像 */
  .plan-cover {
    position: relative;
    width: 100%;
    height: 160px;
    background: var(--wash);
    overflow: hidden;
    border-bottom: 1px solid var(--line);
  }

  .plan-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s ease;
  }

  .plan-row:hover .plan-cover img {
    transform: scale(1.04);
  }

  /* 表示中状態 */
  .plan-row.is-active {
    border-color: var(--green);
    box-shadow: 5px 5px 0 var(--green);
  }

  .plan-row.is-active::before {
    display: none; /* 元の左側アクセントバーを隠す */
  }

  /* アクションフック領域 */
  .plan-open {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    padding: 16px;
    text-decoration: none;
    color: inherit;
  }

  .plan-open:hover,
  .plan-open:focus-visible {
    background: none;
  }

  /* ドットバッジ（カード左上にフロート表示） */
  .plan-dot-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 10;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 0;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(4px);
    border: 1px solid rgba(11, 90, 66, 0.15);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    font-size: 11px;
    font-weight: 700;
    color: var(--ink);
    pointer-events: none;
  }

  .plan-dot {
    flex: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #68746e;
  }

  .plan-dot.local { background: var(--green); }
  .plan-dot.googleSheets { background: var(--blue); }
  .plan-dot.appsScript { background: var(--violet); }
  .plan-dot.sample { background: #9aa5a0; }

  .plan-body {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .plan-name {
    margin: 0;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 17px;
    font-weight: 750;
    line-height: 1.3;
    overflow-wrap: anywhere;
  }

  .plan-tag {
    flex: none;
    padding: 2px 8px;
    border-radius: 0;
    background: var(--green-soft);
    color: var(--green);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .03em;
  }

  .plan-meta {
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 500;
  }

  .plan-route {
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
    background: var(--wash);
    padding: 6px 10px;
    border-radius: 0;
    border: 1px solid rgba(0, 0, 0, 0.02);
    white-space: normal;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.4;
  }

  /* 操作ツール */
  .plan-tools {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 15;
  }

  .plan-menu-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(4px);
    color: var(--muted);
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    transition: all 0.2s ease;
  }

  .plan-menu-btn:hover,
  .plan-menu-btn:focus-visible,
  .plan-menu-btn[aria-expanded="true"] {
    border-color: var(--green);
    color: var(--green);
    background: #fff;
    transform: scale(1.05);
  }

  .plan-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 20;
    min-width: 168px;
    display: grid;
    border: 1px solid var(--line-strong);
    border-radius: 0;
    background: #fff;
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    overflow: hidden;
  }

  .plan-menu[hidden] { display: none; }

  .plan-menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 14px;
    border: 0;
    border-bottom: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .plan-menu-item:last-child { border-bottom: 0; }

  .plan-menu-item:hover,
  .plan-menu-item:focus-visible {
    background: var(--wash);
  }

  .plan-menu-item.danger {
    color: var(--red);
  }

  .plan-menu-item:disabled {
    opacity: .45;
    cursor: not-allowed;
  }

  /* 空状態（Empty State） */
  .hub-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 48px 24px;
    border: 2px dashed var(--line-strong);
    border-radius: 0;
    background: var(--wash);
    text-align: center;
    color: var(--muted);
    grid-column: 1 / -1;
  }

  .hub-empty b {
    color: var(--ink);
    font-size: 16px;
    margin-top: 4px;
  }

  .hub-foot {
    padding: 24px 24px 36px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 500;
    line-height: 1.7;
    background: var(--wash);
  }

  .pub-toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    max-width: min(560px, calc(100% - 24px));
    z-index: 9997;
    display: inline-flex;
    align-items: flex-start;
    gap: 8px;
    padding: 12px 16px;
    border: 1px solid var(--green);
    background: #fff;
    color: var(--ink);
    font-size: 13px;
    font-weight: 760;
  }

  .pub-toast.is-error { border-color: var(--red); color: var(--red); }

  .pub-modal {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: grid;
    place-items: center;
    padding: 18px;
    background: rgba(255, 255, 255, .96);
  }

  .pub-box {
    width: min(420px, 100%);
    border: 1px solid var(--line-strong);
    background: #fff;
  }

  .pub-box h2 {
    margin: 0;
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--line);
    font-size: 18px;
    font-weight: 850;
  }

  .pub-body {
    display: grid;
    gap: 10px;
    padding: 16px 18px 18px;
  }

  .pub-body p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
  }

  .pub-body input {
    width: 100%;
    min-height: 46px;
    border: 2px solid var(--green);
    background: #fff;
    color: var(--ink);
    padding: 10px 12px;
    font: inherit;
    font-size: 16px;
  }

  .pub-actions {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
  }

  .pub-actions button {
    min-height: 44px;
    border: 1px solid var(--green);
    background: var(--green);
    color: #fff;
    font: inherit;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
  }

  .pub-actions button.secondary {
    background: #fff;
    color: var(--green);
  }

  .pub-error {
    min-height: 16px;
    color: var(--red);
    font-size: 12px;
    font-weight: 720;
  }

  @media (max-width: 720px) {
    .hub {
      border-right: 0;
      border-left: 0;
    }
    .hub-head,
    .hub-toolbar,
    .hub-grid,
    .hub-foot {
      padding-right: 14px;
      padding-left: 14px;
    }
    .hub-toolbar {
      grid-template-columns: 1fr;
    }
    .hub-grid {
      padding-right: 14px;
      padding-left: 14px;
      gap: 16px;
    }
  }
</style>
</head>
<body>
<main class="hub">
  <div data-app-header></div>

  <div class="hub-toolbar">
    <input type="search" data-filter placeholder="旅行名、ルートで検索" aria-label="計画を検索">
    <a class="hub-new" href="plan-editor.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="hi" aria-hidden="true" focusable="false"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg><span>新規計画</span></a>
  </div>

  <div class="hub-sec-head">
    <span class="hub-sec-ic" data-ic="listBullet"></span>
    <h2>自分の計画</h2>
    <span class="hub-sec-count" data-count-mine></span>
  </div>
  <section class="hub-grid" data-grid-mine aria-live="polite"></section>

  <div class="hub-sec-head" data-public-head hidden>
    <span class="hub-sec-ic" data-ic="globeAlt"></span>
    <h2>みんなの公開計画</h2>
    <span class="hub-sec-count" data-count-public></span>
  </div>
  <section class="hub-grid" data-grid-public aria-live="polite" hidden></section>

  <footer class="hub-foot">
    計画はこの端末内（ブラウザ）に保存されます。費用入力・精算は Google Sheets 連携の計画で使えます。
  </footer>
</main>

<script src="./trip-config.js"></script>
<script type="module" src="./src/plans/main.ts"></script>
</body>
</html>
