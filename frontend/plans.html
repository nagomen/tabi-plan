<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5a42">
<link rel="manifest" href="site.webmanifest">
<link rel="icon" href="icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icon-192.png">
<title>旅行計画一覧</title>
<style>
  :root {
    --ink: #111916;
    --muted: #66716b;
    --line: #dfe4e0;
    --line-strong: #c3ccc5;
    --paper: #ffffff;
    --wash: #f7f9f7;
    --green: #0b5a42;
    --green-soft: #e7f1ec;
    --blue: #22719d;
    --amber: #b87418;
    --red: #cf4f3d;
    --violet: #6246a6;
  }

  .hi { width: 1.15em; height: 1.15em; vertical-align: -0.18em; flex: none; }

  html { background: #fff; }
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #fff;
    color: var(--ink);
    font-family: "Avenir Next", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    line-height: 1.55;
  }

  a { color: inherit; }

  .hub {
    max-width: 1180px;
    margin: 0 auto;
    border: 1px solid var(--line-strong);
    background: var(--paper);
    min-height: 100vh;
  }

  .hub-head {
    position: relative;
    padding: 22px 24px;
    border-bottom: 1px solid var(--line);
    background:
      linear-gradient(90deg, rgba(11, 90, 66, .05), transparent 42%),
      #fff;
  }

  .hub-mypage {
    position: absolute;
    top: 18px;
    right: 20px;
    display: inline-grid;
    place-items: center;
    width: 40px;
    height: 40px;
    border: 1px solid var(--line-strong);
    border-radius: 50%;
    background: #fff;
    color: var(--ink);
    text-decoration: none;
    transition: color .12s ease, border-color .12s ease;
  }
  .hub-mypage:hover, .hub-mypage:focus-visible { color: var(--green); border-color: var(--green); }
  .hub-mypage .hi { width: 20px; height: 20px; vertical-align: 0; }

  .hub-kicker {
    margin: 0 0 4px;
    color: var(--green);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
  }

  .hub-title {
    margin: 0;
    font-size: clamp(23px, 3.4vw, 30px);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: .01em;
  }

  .hub-sub {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 400;
  }

  .hub-toolbar {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 10px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--wash);
  }

  .hub-toolbar input {
    width: 100%;
    min-height: 44px;
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    background: #fff;
    color: var(--ink);
    padding: 8px 13px;
    font: inherit;
    font-size: 14px;
    font-weight: 400;
  }

  .hub-toolbar input:focus-visible {
    outline: none;
    border-color: var(--green);
    box-shadow: 0 0 0 3px var(--green-soft);
  }

  .hub-new {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    min-height: 44px;
    padding: 0 22px;
    border: 1px solid var(--green);
    border-radius: 7px;
    background: var(--green);
    color: #fff;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .02em;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background .15s ease;
  }

  .hub-new:hover,
  .hub-new:focus-visible {
    background: #0d6c4f;
  }

  .hub-new .hi {
    width: 1.05em;
    height: 1.05em;
  }

  .hub-grid {
    padding: 6px 24px 28px;
  }

  /* 1計画 = 1行。タップで開く。枠は積み重ねの薄線1本のみ。 */
  .plan-row {
    position: relative;
    display: flex;
    align-items: stretch;
    gap: 4px;
    border-bottom: 1px solid var(--line);
  }

  .plan-row:first-child {
    border-top: 1px solid var(--line);
  }

  /* 表示中: 左の細いアクセントバー（状態は色を一本化） */
  .plan-row.is-active::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--green);
  }

  /* 行全体（メイン領域）が「開く」のヒット領域 */
  .plan-open {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: flex-start;
    gap: 11px;
    padding: 14px 8px 14px 16px;
    text-decoration: none;
    color: inherit;
  }

  .plan-open:hover,
  .plan-open:focus-visible {
    background: var(--wash);
  }

  /* 種別は小さなドット1つ（色の意味は「種別」に限定） */
  .plan-dot {
    flex: none;
    width: 8px;
    height: 8px;
    margin-top: 7px;
    border-radius: 50%;
    background: #68746e;
  }

  .plan-dot.local { background: var(--green); }
  .plan-dot.googleSheets { background: var(--blue); }
  .plan-dot.appsScript { background: var(--violet); }
  .plan-dot.sample { background: #9aa5a0; }

  .plan-body {
    min-width: 0;
    display: grid;
    gap: 2px;
  }

  /* 主役は旅行名のみ少しだけ強く。他は素直なウエイトで読みやすく。 */
  .plan-name {
    margin: 0;
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }

  .plan-tag {
    flex: none;
    padding: 1px 8px;
    border-radius: 999px;
    background: var(--green-soft);
    color: var(--green);
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: .03em;
  }

  .plan-meta {
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 400;
  }

  .plan-route {
    color: var(--muted);
    font-size: 12px;
    font-weight: 400;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 副操作はケバブの中に格納。表面はアイコン1つだけ。 */
  .plan-tools {
    position: relative;
    flex: none;
    display: flex;
    align-items: center;
    padding-right: 8px;
  }

  .plan-menu-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border: 1px solid transparent;
    background: none;
    color: var(--muted);
    cursor: pointer;
  }

  .plan-menu-btn:hover,
  .plan-menu-btn:focus-visible,
  .plan-menu-btn[aria-expanded="true"] {
    border-color: var(--line-strong);
    color: var(--ink);
    background: #fff;
  }

  .plan-menu {
    position: absolute;
    top: calc(100% - 2px);
    right: 8px;
    z-index: 20;
    min-width: 168px;
    display: grid;
    border: 1px solid var(--line-strong);
    background: #fff;
    box-shadow: 0 14px 40px rgba(17, 25, 22, .16);
  }

  .plan-menu[hidden] { display: none; }

  .plan-menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 14px;
    border: 0;
    border-bottom: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
  }

  .plan-menu-item:last-child { border-bottom: 0; }

  .plan-menu-item:hover,
  .plan-menu-item:focus-visible {
    background: var(--wash);
  }

  .plan-menu-item.danger {
    color: var(--red);
  }

  .plan-menu-item:disabled {
    opacity: .45;
    cursor: not-allowed;
  }

  .hub-empty {
    display: grid;
    gap: 8px;
    padding: 40px 22px;
    border: 1px dashed var(--line-strong);
    background: var(--wash);
    text-align: center;
    color: var(--muted);
  }

  .hub-empty b {
    color: var(--ink);
    font-size: 16px;
  }

  .hub-foot {
    padding: 16px 24px 28px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
    font-weight: 400;
    line-height: 1.7;
  }

  .pub-toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    max-width: min(560px, calc(100% - 24px));
    z-index: 9997;
    display: inline-flex;
    align-items: flex-start;
    gap: 8px;
    padding: 12px 16px;
    border: 1px solid var(--green);
    background: #fff;
    color: var(--ink);
    font-size: 13px;
    font-weight: 760;
    box-shadow: 0 16px 48px rgba(17, 25, 22, .18);
  }

  .pub-toast.is-error { border-color: var(--red); color: var(--red); }

  .pub-modal {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: grid;
    place-items: center;
    padding: 18px;
    background: rgba(255, 255, 255, .96);
  }

  .pub-box {
    width: min(420px, 100%);
    border: 1px solid var(--line-strong);
    background: #fff;
  }

  .pub-box h2 {
    margin: 0;
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--line);
    font-size: 18px;
    font-weight: 850;
  }

  .pub-body {
    display: grid;
    gap: 10px;
    padding: 16px 18px 18px;
  }

  .pub-body p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
  }

  .pub-body input {
    width: 100%;
    min-height: 46px;
    border: 2px solid var(--green);
    background: #f8fbf9;
    color: var(--ink);
    padding: 10px 12px;
    font: inherit;
    font-size: 16px;
  }

  .pub-actions {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
  }

  .pub-actions button {
    min-height: 44px;
    border: 1px solid var(--green);
    background: var(--green);
    color: #fff;
    font: inherit;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
  }

  .pub-actions button.secondary {
    background: #fff;
    color: var(--green);
  }

  .pub-error {
    min-height: 16px;
    color: var(--red);
    font-size: 12px;
    font-weight: 720;
  }

  @media (max-width: 720px) {
    .hub {
      border-right: 0;
      border-left: 0;
    }
    .hub-head,
    .hub-toolbar,
    .hub-grid,
    .hub-foot {
      padding-right: 14px;
      padding-left: 14px;
    }
    .hub-toolbar {
      grid-template-columns: 1fr;
    }
    .hub-grid {
      padding-right: 0;
      padding-left: 0;
    }
    .plan-open {
      padding-left: 14px;
    }
  }
</style>
</head>
<body>
<main class="hub">
  <header class="hub-head">
    <a class="hub-mypage" href="mypage.html" aria-label="マイページ" title="マイページ"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="hi" aria-hidden="true" focusable="false"><path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg></a>
    <p class="hub-kicker">Travel Plans</p>
    <h1 class="hub-title">旅行計画</h1>
    <div class="hub-sub">
      <span data-count>読み込み中</span>
      <span>選んだ計画でダッシュボードが開きます</span>
    </div>
  </header>

  <div class="hub-toolbar">
    <input type="search" data-filter placeholder="旅行名、ルートで検索" aria-label="計画を検索">
    <a class="hub-new" href="plan-editor.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="hi" aria-hidden="true" focusable="false"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg><span>新規計画</span></a>
  </div>

  <section class="hub-grid" data-grid aria-live="polite"></section>

  <footer class="hub-foot">
    計画はこの端末内（ブラウザ）に保存されます。費用入力・精算は Google Sheets 連携の計画で使えます。
  </footer>
</main>

<script src="./trip-config.js"></script>
<script type="module" src="./src/plans/main.ts"></script>
</body>
</html>
