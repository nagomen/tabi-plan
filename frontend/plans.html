<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5a42">
<link rel="manifest" href="site.webmanifest">
<link rel="icon" href="icon-32.webp" type="image/webp" sizes="32x32">
<link rel="apple-touch-icon" href="icon-192.webp">
<title>旅行一覧 | Tabi Plan</title>
</head>
<body>
<main class="hub">
  <div data-app-header></div>

  <section class="hub-start" aria-labelledby="startTitle">
    <div class="start-hero">
      <div class="start-copy">
        <p class="start-kicker">Start your next route</p>
        <h1 class="start-title" id="startTitle"><span>旅を見つける。</span><span>計画する。</span></h1>
      </div>
      <div class="start-visual">
        <img src="./images/thumbs/cover_japan.webp" alt="日本旅行の風景">
        <div class="start-actions">
          <a class="start-action primary" href="plan-editor.html" data-create-main></a>
        </div>
      </div>
    </div>
  </section>

  <section class="invite-strip" data-invite-strip aria-live="polite">
    <div class="invite-strip-inner">
      <span class="invite-mark" data-ic="paperAirplane"></span>
      <span class="invite-copy">
        <b data-invite-title>招待があります</b>
        <span data-invite-note></span>
      </span>
      <a class="start-action" href="#mine">参加中の計画を見る</a>
    </div>
  </section>

  <section class="hub-discover" data-discover-section aria-label="公開旅行を探す">
    <div class="discover-grid">
      <section class="discover-panel discover-panel--new" id="discover-new">
        <div class="discover-head">
          <h2 data-ic="sparkles">新着旅行</h2>
          <span data-new-count></span>
        </div>
        <div class="discover-card-grid" data-ranking-new></div>
      </section>
      <section class="discover-panel discover-panel--views" id="discover-ranking">
        <div class="discover-head">
          <h2 data-ic="eye">観覧数ランキング</h2>
          <span data-views-total></span>
        </div>
        <div class="discover-card-grid" data-ranking-views></div>
      </section>
      <section class="discover-panel discover-panel--location" id="discover-destinations">
        <div class="discover-head">
          <h2 data-ic="mapPin">場所から旅行計画を探す</h2>
          <span><b data-destination-count></b> / <b data-map-count></b></span>
        </div>
        <div class="location-explorer" id="discover-map">
          <div class="location-side">
            <div class="location-side-head" data-location-head></div>
            <div class="dest-list" data-destinations></div>
            <div class="location-plan-list" data-location-plans hidden></div>
          </div>
          <div class="location-detail">
            <div class="map-board" data-map-board></div>
            <div class="location-schedule" data-location-schedule hidden></div>
          </div>
        </div>
      </section>
    </div>
  </section>

  <div class="hub-toolbar" data-hub-toolbar>
    <input type="search" data-filter placeholder="旅行名、ルートで検索" aria-label="計画を検索">
  </div>

  <div class="hub-sec-head" id="mine" data-mine-head>
    <span class="hub-sec-ic" data-ic="listBullet"></span>
    <h2>自分の計画</h2>
    <span class="hub-sec-count" data-count-mine></span>
  </div>
  <section class="hub-grid" data-grid-mine aria-live="polite"></section>

  <div class="hub-sec-head" data-public-head hidden>
    <span class="hub-sec-ic" data-ic="globeAlt"></span>
    <h2>みんなの公開計画</h2>
    <span class="hub-sec-count" data-count-public></span>
  </div>
  <section class="hub-grid" data-grid-public aria-live="polite" hidden></section>

</main>

<script src="./trip-config.js"></script>
<script type="module" src="./src/plans/main.ts"></script>
</body>
</html>
