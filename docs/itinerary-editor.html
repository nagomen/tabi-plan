<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>行程編集 | 旅行</title>
<style>
  :root {
    --ink: #111916;
    --muted: #66716b;
    --line: #dfe4e0;
    --line-strong: #c3ccc5;
    --paper: #ffffff;
    --wash: #f7f9f7;
    --green: #0b5a42;
    --green-soft: #e7f1ec;
    --blue: #22719d;
    --red: #cf4f3d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #fff;
    color: var(--ink);
    font-family: "Avenir Next", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    line-height: 1.55;
  }

  a { color: inherit; }

  .edit-app {
    max-width: 1180px;
    margin: 0 auto;
    border: 1px solid var(--line-strong);
    background: var(--paper);
  }

  .ed-head {
    position: sticky;
    top: 0;
    z-index: 20;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 12px;
    align-items: center;
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
    background: rgba(255, 255, 255, .96);
    backdrop-filter: blur(16px);
  }

  .ed-head h1 {
    margin: 0;
    font-size: clamp(24px, 5vw, 38px);
    line-height: 1;
    letter-spacing: 0;
  }

  .ed-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 7px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 760;
  }

  .ed-dashboard {
    display: grid;
    place-items: center;
    min-height: 38px;
    padding: 0 12px;
    border: 1px solid rgba(11, 90, 66, .36);
    color: var(--green);
    font-size: 13px;
    font-weight: 900;
    text-decoration: none;
    white-space: nowrap;
  }

  .ed-toolbar {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 160px;
    gap: 10px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--wash);
  }

  .ed-toolbar input,
  .ed-toolbar select,
  .ed-field input,
  .ed-field textarea {
    width: 100%;
    min-width: 0;
    min-height: 38px;
    border: 1px solid var(--line-strong);
    background: #fff;
    color: var(--ink);
    font: inherit;
    font-size: 14px;
  }

  .ed-toolbar input,
  .ed-toolbar select,
  .ed-field input {
    padding: 7px 9px;
  }

  .ed-list {
    display: grid;
    gap: 12px;
    padding: 14px 18px 22px;
  }

  .ed-row {
    border: 1px solid var(--line);
    background: #fff;
  }

  .ed-row.is-hidden {
    opacity: .72;
  }

  .ed-row-head {
    display: grid;
    grid-template-columns: 88px minmax(0, 1fr) auto;
    gap: 10px;
    align-items: center;
    padding: 11px 12px;
    border-bottom: 1px solid var(--line);
    background: #fff;
  }

  .ed-date {
    color: var(--muted);
    font-size: 12px;
    font-weight: 850;
  }

  .ed-title {
    min-width: 0;
  }

  .ed-title b {
    display: block;
    overflow: hidden;
    font-size: 16px;
    line-height: 1.25;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .ed-title span {
    display: block;
    overflow: hidden;
    color: var(--muted);
    font-size: 12px;
    font-weight: 720;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .ed-status {
    color: var(--muted);
    font-size: 12px;
    font-weight: 850;
    text-align: right;
    white-space: nowrap;
  }

  .ed-body {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
    padding: 12px;
  }

  .ed-field {
    display: grid;
    gap: 5px;
    min-width: 0;
  }

  .ed-field.wide {
    grid-column: span 2;
  }

  .ed-field.full {
    grid-column: 1 / -1;
  }

  .ed-field span,
  .ed-visible span {
    color: var(--muted);
    font-size: 11px;
    font-weight: 760;
  }

  .ed-field textarea {
    min-height: 68px;
    padding: 8px 9px;
    resize: vertical;
  }

  .ed-actions {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    gap: 10px;
    align-items: center;
    padding: 0 12px 12px;
  }

  .ed-visible {
    display: inline-flex;
    gap: 8px;
    align-items: center;
    min-width: 0;
    color: var(--muted);
    font-size: 12px;
    font-weight: 760;
  }

  .ed-save {
    min-height: 38px;
    min-width: 96px;
    border: 1px solid var(--green);
    background: var(--green);
    color: #fff;
    font: inherit;
    font-size: 13px;
    font-weight: 900;
    cursor: pointer;
  }

  .ed-save:disabled {
    border-color: var(--line-strong);
    background: var(--line);
    color: var(--muted);
    cursor: wait;
  }

  .ed-row-msg {
    min-width: 0;
    color: var(--muted);
    font-size: 12px;
    font-weight: 720;
  }

  .ed-row-msg.is-error { color: var(--red); }
  .ed-row-msg.is-ok { color: var(--green); }

  .ed-auth {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: grid;
    place-items: center;
    padding: 18px;
    background: rgba(255, 255, 255, .96);
  }

  .ed-auth-box {
    width: min(420px, 100%);
    border: 1px solid var(--line-strong);
    background: #fff;
  }

  .ed-auth-box h2 {
    margin: 0;
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--line);
    font-size: 18px;
  }

  .ed-auth-body {
    display: grid;
    gap: 10px;
    padding: 16px 18px 18px;
  }

  .ed-auth-body input,
  .ed-auth-body button {
    width: 100%;
    min-height: 42px;
    font: inherit;
  }

  .ed-auth-body input {
    border: 1px solid var(--line-strong);
    padding: 8px 10px;
  }

  .ed-auth-body button {
    border: 1px solid var(--green);
    background: var(--green);
    color: #fff;
    font-weight: 850;
  }

  .ed-auth-error {
    min-height: 18px;
    color: var(--red);
    font-size: 12px;
    font-weight: 720;
  }

  .ed-empty,
  .ed-error {
    padding: 18px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--muted);
    font-size: 13px;
    font-weight: 760;
  }

  @media (max-width: 720px) {
    .edit-app {
      border-right: 0;
      border-left: 0;
    }

    .ed-head {
      grid-template-columns: 1fr;
      padding: 14px 14px 12px;
    }

    .ed-dashboard {
      justify-self: start;
    }

    .ed-toolbar {
      grid-template-columns: 1fr;
      padding: 10px 14px;
    }

    .ed-list {
      padding: 12px 0 20px;
    }

    .ed-row {
      border-right: 0;
      border-left: 0;
    }

    .ed-row-head {
      grid-template-columns: 72px minmax(0, 1fr);
    }

    .ed-status {
      grid-column: 1 / -1;
      text-align: left;
    }

    .ed-body {
      grid-template-columns: 1fr;
      padding: 12px 14px;
    }

    .ed-field.wide {
      grid-column: 1;
    }

    .ed-actions {
      grid-template-columns: 1fr;
      padding: 0 14px 14px;
    }

    .ed-save {
      width: 100%;
    }
  }
</style>
</head>
<body>
<div class="edit-app" id="editor">
  <header class="ed-head">
    <div>
      <h1>行程編集</h1>
      <div class="ed-meta">
        <span data-trip-title>旅行</span>
        <span data-status>読み込み中</span>
      </div>
    </div>
    <a class="ed-dashboard" href="index.html">ダッシュボード</a>
  </header>

  <div class="ed-toolbar">
    <input type="search" data-filter placeholder="日付、都市、内容で検索">
    <select data-day-filter aria-label="日付で絞り込み"></select>
  </div>

  <main class="ed-list" data-list></main>
</div>

<script src="trip-config.js"></script>
<script>
  (function () {
    function mergeConfig(base, override) {
      const result = { ...(base || {}) };
      Object.keys(override || {}).forEach((key) => {
        const value = override[key];
        const current = result[key];
        if (value && typeof value === "object" && !Array.isArray(value) &&
            current && typeof current === "object" && !Array.isArray(current)) {
          result[key] = mergeConfig(current, value);
        } else if (value !== undefined) {
          result[key] = value;
        }
      });
      return result;
    }

    function safeTripSlug(value) {
      return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "") || "trip";
    }

    function normalizeTripConfig(config) {
      const next = config || {};
      next.tripTitle = next.tripTitle || "旅行";
      next.tripSlug = safeTripSlug(next.tripSlug || next.slug || next.tripTitle);
      next.auth = next.auth || {};
      if (!next.auth.storageKey) next.auth.storageKey = `trip-dashboard-auth-${next.tripSlug}`;
      return next;
    }

    function applyDocumentTripTitle(title) {
      const tripTitle = title || "旅行";
      document.title = `行程編集 | ${tripTitle}`;
    }

    const DEFAULT_CONFIG = {
      tripSlug: "trip-template",
      tripTitle: "旅行",
      appsScriptUrl: "",
      auth: {
        enabled: true,
        mode: "appsScript",
        passwordHash: "",
        storageKey: "",
        rememberDays: 14
      }
    };
    const CONFIG = normalizeTripConfig(mergeConfig(DEFAULT_CONFIG, window.TRIP_CONFIG || {}));
    applyDocumentTripTitle(CONFIG.tripTitle);

    const root = document.getElementById("editor");
    const qs = (selector) => root.querySelector(selector);
    const qsa = (selector) => Array.from(root.querySelectorAll(selector));
    qs("[data-trip-title]").textContent = CONFIG.tripTitle || "旅行";
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[ch]);

    let state = { data: null, rows: [], filter: "", day: "" };

    function callAppsScript(params) {
      return new Promise((resolve, reject) => {
        const callback = "__tripEditorCallback_" + Math.random().toString(36).slice(2);
        const script = document.createElement("script");
        const query = new URLSearchParams({ ...params, callback, cachebust: Date.now() });
        window[callback] = (response) => {
          delete window[callback];
          script.remove();
          if (!response || response.ok === false) {
            reject(new Error(response && response.error ? response.error : "Apps Script API error"));
            return;
          }
          resolve(response);
        };
        script.onerror = () => {
          delete window[callback];
          script.remove();
          reject(new Error("Apps Script APIを読み込めませんでした"));
        };
        script.src = CONFIG.appsScriptUrl + (CONFIG.appsScriptUrl.includes("?") ? "&" : "?") + query.toString();
        document.head.appendChild(script);
      });
    }

    async function sha256Hex(text) {
      const bytes = new TextEncoder().encode(text);
      const digest = await crypto.subtle.digest("SHA-256", bytes);
      return Array.from(new Uint8Array(digest)).map((byte) => byte.toString(16).padStart(2, "0")).join("");
    }

    function hasAuthSession() {
      if (!CONFIG.auth.enabled) return true;
      try {
        const session = JSON.parse(localStorage.getItem(CONFIG.auth.storageKey) || "{}");
        return session && session.expiresAt && Date.now() < session.expiresAt && session.token;
      } catch (_) {
        return false;
      }
    }

    function getAuthToken() {
      try {
        const session = JSON.parse(localStorage.getItem(CONFIG.auth.storageKey) || "{}");
        return session && session.expiresAt && Date.now() < session.expiresAt ? session.token || "" : "";
      } catch (_) {
        return "";
      }
    }

    function saveAuthSession(token, expiresAt) {
      const days = Number(CONFIG.auth.rememberDays || 1);
      localStorage.setItem(CONFIG.auth.storageKey, JSON.stringify({
        ok: true,
        token: token || "",
        expiresAt: expiresAt || Date.now() + days * 24 * 60 * 60 * 1000
      }));
    }

    function clearAuthSession() {
      localStorage.removeItem(CONFIG.auth.storageKey);
    }

    function requestPassword() {
      return new Promise((resolve) => {
        if (!CONFIG.auth.enabled || hasAuthSession()) {
          resolve(true);
          return;
        }

        const gate = document.createElement("div");
        gate.className = "ed-auth";
        gate.innerHTML = `
          <form class="ed-auth-box">
            <h2>行程編集を開く</h2>
            <div class="ed-auth-body">
              <input type="password" autocomplete="current-password" autofocus aria-label="パスワード">
              <button type="submit">開く</button>
              <div class="ed-auth-error" aria-live="polite"></div>
            </div>
          </form>`;
        document.body.appendChild(gate);

        const form = gate.querySelector("form");
        const input = gate.querySelector("input");
        const error = gate.querySelector(".ed-auth-error");
        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          try {
            const passwordHash = await sha256Hex(input.value || "");
            const response = await callAppsScript({ action: "auth", passwordHash });
            saveAuthSession(response.token, response.expiresAt);
            gate.remove();
            resolve(true);
          } catch (apiError) {
            input.value = "";
            input.focus();
            error.textContent = apiError.message || "認証に失敗しました。";
          }
        });
      });
    }

    function isAuthError(error) {
      const message = String(error && error.message ? error.message : error || "");
      return /auth|token|password|Authentication|Invalid token|Token expired|認証|権限|Password/i.test(message);
    }

    async function loadData(didRetryAuth) {
      try {
        qs("[data-status]").textContent = "読み込み中";
        const response = await callAppsScript({ action: "data", token: getAuthToken(), includeHidden: "true" });
        state.data = response.data;
        state.rows = response.data.itinerary || [];
        qs("[data-trip-title]").textContent = response.data.trip && response.data.trip.title || CONFIG.tripTitle || "旅行";
        qs("[data-status]").textContent = `行程 ${state.rows.length}件`;
        renderDayFilter();
        renderList();
      } catch (error) {
        if (!didRetryAuth && isAuthError(error)) {
          clearAuthSession();
          await requestPassword();
          return loadData(true);
        }
        qs("[data-list]").innerHTML = `<div class="ed-error">${escapeHtml(error.message || "読み込みに失敗しました。")}</div>`;
        qs("[data-status]").textContent = "読み込み失敗";
      }
    }

    function renderDayFilter() {
      const select = qs("[data-day-filter]");
      const days = Array.from(new Map(state.rows.map((row) => [row.date, row])).values());
      select.innerHTML = `<option value="">すべての日</option>` + days.map((row) =>
        `<option value="${escapeHtml(row.date)}">${escapeHtml(row.date)} ${escapeHtml(row.day || "")} ${escapeHtml(row.area || "")}</option>`
      ).join("");
      select.value = state.day;
    }

    function rowText(row) {
      const edit = row.edit || {};
      return [
        row.date, row.day, row.area, row.title, row.place, row.note,
        edit.rawMemo, edit.origin, edit.destination, edit.transport, edit.purpose
      ].join(" ").toLowerCase();
    }

    function filteredRows() {
      const filter = state.filter.trim().toLowerCase();
      return state.rows.filter((row) => {
        if (state.day && row.date !== state.day) return false;
        if (filter && !rowText(row).includes(filter)) return false;
        return true;
      });
    }

    function sourceLine(row) {
      const edit = row.edit || {};
      const route = edit.origin && edit.destination ? `${edit.origin} -> ${edit.destination}` : row.place || row.area || "";
      return [route, edit.transport, edit.duration, edit.status, edit.certainty].filter(Boolean).join(" / ");
    }

    function renderList() {
      const rows = filteredRows();
      const list = qs("[data-list]");
      if (!rows.length) {
        list.innerHTML = `<div class="ed-empty">該当する行程はありません。</div>`;
        return;
      }
      list.innerHTML = rows.map(renderRow).join("");
      qsa("[data-row-form]").forEach((form) => {
        form.addEventListener("input", () => {
          form.dataset.dirty = "true";
          const msg = form.querySelector("[data-row-msg]");
          if (msg) {
            msg.textContent = "未保存";
            msg.className = "ed-row-msg";
          }
        });
        form.addEventListener("change", () => {
          form.dataset.dirty = "true";
        });
        form.addEventListener("submit", saveRow);
      });
    }

    function renderRow(row) {
      const edit = row.edit || {};
      const visible = edit.visible !== false;
      return `
        <form class="ed-row ${visible ? "" : "is-hidden"}" data-row-form data-row-number="${escapeHtml(row.rowNumber || "")}">
          <div class="ed-row-head">
            <div class="ed-date">${escapeHtml(row.date || "")}<br>${escapeHtml(row.day || "")}</div>
            <div class="ed-title">
              <b>${escapeHtml(row.title || "")}</b>
              <span>${escapeHtml(sourceLine(row))}</span>
            </div>
            <div class="ed-status">${visible ? "公開" : "非表示"}</div>
          </div>
          <div class="ed-body">
            <label class="ed-field">
              <span>表示時刻</span>
              <input name="displayTime" value="${escapeHtml(edit.displayTime || row.time || "")}" placeholder="07:00 / 午前 / 夜">
            </label>
            <label class="ed-field wide">
              <span>表示タイトル</span>
              <input name="displayTitle" value="${escapeHtml(edit.displayTitle || "")}" placeholder="${escapeHtml(row.title || "")}">
            </label>
            <label class="ed-field">
              <span>天気</span>
              <input name="weather" value="${escapeHtml(edit.weather || "")}" placeholder="24C / 18C">
            </label>
            <label class="ed-field wide">
              <span>表示場所</span>
              <input name="displayPlace" value="${escapeHtml(edit.displayPlace || "")}" placeholder="${escapeHtml(row.place || "")}">
            </label>
            <label class="ed-field wide">
              <span>地図検索</span>
              <input name="mapQuery" value="${escapeHtml(edit.mapQuery || "")}" placeholder="${escapeHtml(row.mapQuery || row.place || "")}">
            </label>
            <label class="ed-field full">
              <span>表示メモ</span>
              <textarea name="displayNote" placeholder="${escapeHtml(edit.rawMemo || "")}">${escapeHtml(edit.displayNote || "")}</textarea>
            </label>
            <label class="ed-field full">
              <span>必要情報</span>
              <textarea name="needed" placeholder="当日見るべき情報だけ">${escapeHtml(edit.needed || "")}</textarea>
            </label>
          </div>
          <div class="ed-actions">
            <label class="ed-visible">
              <input type="checkbox" name="visible" ${visible ? "checked" : ""}>
              <span>公開ページに表示</span>
            </label>
            <div class="ed-row-msg" data-row-msg></div>
            <button class="ed-save" type="submit">保存</button>
          </div>
        </form>`;
    }

    async function saveRow(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector("button[type='submit']");
      const msg = form.querySelector("[data-row-msg]");
      const setMsg = (text, type) => {
        msg.textContent = text || "";
        msg.className = "ed-row-msg" + (type ? ` is-${type}` : "");
      };
      button.disabled = true;
      setMsg("保存中", "");
      try {
        const response = await callAppsScript({
          action: "itineraryUpdate",
          token: getAuthToken(),
          includeHidden: "true",
          rowNumber: form.dataset.rowNumber,
          displayTime: form.elements.displayTime.value,
          displayTitle: form.elements.displayTitle.value,
          displayPlace: form.elements.displayPlace.value,
          displayNote: form.elements.displayNote.value,
          needed: form.elements.needed.value,
          mapQuery: form.elements.mapQuery.value,
          weather: form.elements.weather.value,
          visible: form.elements.visible.checked ? "TRUE" : "FALSE"
        });
        state.data = response.data;
        state.rows = response.data.itinerary || [];
        qs("[data-status]").textContent = `保存しました / 行程 ${state.rows.length}件`;
        form.dataset.dirty = "false";
        setMsg("保存しました", "ok");
        renderDayFilter();
        renderList();
      } catch (error) {
        if (isAuthError(error)) clearAuthSession();
        setMsg(error.message || "保存に失敗しました", "error");
      } finally {
        button.disabled = false;
      }
    }

    function initFilters() {
      qs("[data-filter]").addEventListener("input", (event) => {
        state.filter = event.target.value || "";
        renderList();
      });
      qs("[data-day-filter]").addEventListener("change", (event) => {
        state.day = event.target.value || "";
        renderList();
      });
    }

    async function init() {
      initFilters();
      await requestPassword();
      await loadData(false);
    }

    init();
  })();
</script>
</body>
</html>
